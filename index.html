  :root {
    --ink: #12161B;
    --panel: #1B222A;
    --panel2: #232B34;
    /* A translucent hairline rather than a flat colour: it sits correctly
       on any surface level and reads as a seam instead of an outline. */
    --line: rgba(232,238,244,0.09);
    --line-strong: rgba(232,238,244,0.16);
    --text: #E6EBF0;
    --muted: #93A2AE;
    /* Was a bright cyan sitting right beside the Back group's colour. This
       dusty periwinkle is clear of all five group hues and of the green,
       amber and red the app uses semantically. */
    --accent: #8CA8E8;
    --pb: #6FBE86;
    --warn: #D9A75A;
    --bad: #D97C6C;
    /* Depth carried by shadow rather than by heavier borders. */
    --shadow: 0 1px 2px rgba(0,0,0,0.28);
    --shadow-lift: 0 2px 6px rgba(0,0,0,0.3), 0 10px 24px -16px rgba(0,0,0,0.55);
    --r: 8px;
    --r-sm: 6px;
    /* Tints and edges derived from the status colours above. Kept as tokens
       so a palette change cannot leave hand-written rgba() copies behind. */
    --accent-tint: rgba(140,168,232,0.07);
    --accent-edge: rgba(140,168,232,0.38);
    --warn-tint: rgba(217,167,90,0.09);
    --warn-edge: rgba(217,167,90,0.45);
    --bad-tint: rgba(217,124,108,0.09);
    --bad-edge: rgba(217,124,108,0.40);
  }

  /* `manipulation` drops the double-tap-to-zoom gesture, which fires by
     accident when you tap a stepper twice in quick succession while
     logging. It deliberately does NOT disable pinch-to-zoom: that is the
     one people rely on to enlarge text, and the viewport meta above stays
     free of user-scalable=no for the same reason. */
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--ink);
    color: var(--text);
  }

  body {
    font-family: 'Archivo', system-ui, -apple-system, sans-serif;
    font-variant-numeric: tabular-nums;
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
    padding-top: calc(20px + env(safe-area-inset-top));
    padding-right: calc(16px + env(safe-area-inset-right));
    padding-bottom: calc(88px + env(safe-area-inset-bottom));
    padding-left: calc(16px + env(safe-area-inset-left));
  }

  /* ---------------- bottom tab bar ---------------- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
    display: flex;
    background: var(--panel);
    border-top: 1px solid var(--line);
    box-shadow: 0 -8px 24px -12px rgba(0,0,0,0.6);
    padding: 6px calc(4px + env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) calc(4px + env(safe-area-inset-right));
  }
  .tabbar button {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: none; color: var(--muted);
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.1px;
    padding: 6px 2px 4px;
  }
  .tabbar button.active { color: var(--accent); }
  .tabbar svg { width: 22px; height: 22px; }

  /* ---------------- chips (metric / range pickers) ---------------- */
  .chiprow { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .chip {
    padding: 7px 13px; border-radius: 20px;
    background: var(--panel2); border: 1px solid var(--line);
    color: var(--muted); font-size: 13px; font-weight: 600;

  /* ---------------- readout under the big chart ---------------- */
  .readout {

    font-size: 13px; color: var(--muted);

  /* ---------------- inline sparklines on the home tiles ---------------- */
  .tile { position: relative; min-width: 0; }

  .spark { display: block; width: 100%; height: 100%; overflow: visible; }

  h1.title, h2.title {
    font-family: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-weight: 600;
    letter-spacing: 0;
    text-wrap: balance;
    margin: 0;
  }

  .sub { color: var(--muted); font-size: 13px; margin-top: 6px; line-height: 1.55; }
  .lede { color: var(--muted); font-size: 14px; margin-top: 7px; line-height: 1.55; }

  .panel {
    background: var(--panel);

    padding: 18px 20px;
    margin-bottom: 14px;

  .card {

  .name { font-size: 19px; font-weight: 600; }

  .load { font-size: 20px; font-weight: 700; color: var(--accent); white-space: nowrap; }

  .pill {

  button, .btn {

  /* ------------------------------------------------------------------
     BUTTON HIERARCHY

     Every button is a pill now, so shape no longer separates them and the
     whole job falls to fill and colour. Four steps, loudest first:

       1  filled accent      the one thing this page is for

       3  outlined neutral   alternatives and escapes
       4  filled panel       minor, inline, sits inside other content

  .btn-primary {

  .list-row {

  .note {
    background: var(--bad-tint);
    border: 1px solid var(--bad-edge);
    padding: 12px;
    border-radius: 4px;
    margin-bottom: 14px;

  /* A prompt, not a command. Pill rather than slab, outline rather than

  .btn-quiet {
    display: inline-block;
    margin: 0 auto;
    padding: 9px 20px;

  .divider { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }

  pre.export {
    background: var(--panel2);
    border: 1px solid var(--line);

    font-size: 11px;
    line-height: 1.5;
    overflow: auto;
    max-height: 320px;
    white-space: pre;
    color: var(--text);

  .toast {

  .check { display: flex; align-items: center; gap: 10px; margin-top: 16px; font-size: 14px; cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); }

  .group-head {

  .mb-lg { margin-bottom: 24px; }

  /* ---------------- progress dashboard ---------------- */
  :root {
    --mg-back: #74B9D6;

  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }

  .tile-foot { font-size: 12px; color: var(--muted); margin-top: 9px; line-height: 1.5; }

  .mg-row {

  .mg-row:last-child { border-bottom: none; }

  .mg-bar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; }

  .mg-val { font-size: 15px; font-weight: 700; width: 52px; text-align: right; flex: 0 0 auto; }

<script>
"use strict";

/* ----------------------------------------------------------------
   Programme data. Mirrors Gym.md exactly. Nothing added or removed.
   unit: kg | pin (cable stack position) | bw (bodyweight)

   A pin value of 13.5 renders as "13+", matching the file's notation.
------------------------------------------------------------------*/
/* The weekday each session belongs to, and which evenings carry BJJ, used to
   live here. They came out on purpose: this repository is public, and a fixed
   weekly timetable says when you are reliably not at home, which is a more

   the app offers the next session by position in the rotation. */

  { id: "upperB", name: "Upper B" },
  { id: "grip", name: "Grip, neck & abs" },

/* Working loads and peaks used to sit on each line here and are now held only
   in your browser, alongside everything else you log. A public repository
   should not carry how much you lift. Set counts, rep ranges and increments
   stay: they are how the programme is shaped, not how strong you are. */
const PROGRAMME = [
  // ---- Lower A

  { id: "la5", s: "lowerA", name: "Calf raises", unit: "kg", sets: 3, lo: 12, hi: 15, inc: 5 },
  { id: "la6", s: "lowerA", name: "Adductor (in)", unit: "pin", sets: 4, lo: 6, hi: 8, inc: 1 },

  // ---- Upper A
  { id: "ua1", s: "upperA", name: "Machine press (mid)", unit: "kg", sets: 4, lo: 6, hi: 8, inc: 2.5 },
  { id: "ua2", s: "upperA", name: "Bent-over row, underhand BB", unit: "kg", sets: 4, lo: 6, hi: 8, inc: 2.5 },
  { id: "ua3", s: "upperA", name: "Bent-over row, overhand BB (form)", unit: "kg", sets: 4, lo: 6, hi: 8, inc: 2.5 },
  { id: "ua4", s: "upperA", name: "Overhead DB", unit: "kg", sets: 4, lo: 6, hi: 8, inc: 2.5 },
  { id: "ua5", s: "upperA", name: "Cable fly, upper chest", unit: "pin", sets: 4, lo: 6, hi: 8, inc: 0.5 },

------------------------------------------------------------------*/
const fmtPin = (n) => (n % 1 === 0.5 ? Math.floor(n) + "+" : String(n));

function fmtLoad(ex, n) {
  if (!ex) return String(n);
  if (ex.unit === "bw") return "Bodyweight";
  if (n == null) return "not set";
  if (ex.unit === "pin") return '"' + fmtPin(n) + '"';
  return Number(n.toFixed(2)) + "kg";
}

function roundToInc(v, inc) {
  if (!inc) return v;
  return Math.max(inc, Math.round(v / inc) * inc);
}

const today = () => {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
};

const sum = (a) => a.reduce((x, y) => x + y, 0);

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

/**
 * Walks the trailing run of entries at the current load and works out
 * whether the lift is moving, stalling, plateaued or declining.
 */
function statusFor(exId, log) {
  const ent = log.filter((l) => l.exId === exId && l.type === "set").sort((a, b) => a.ts - b.ts);
  if (ent.length === 0) return { code: "new", label: "No data yet", tone: C.muted, streak: 0 };

  const latest = ent[ent.length - 1];
  const run = [];
  for (let i = ent.length - 1; i >= 0; i--) {
    if (ent[i].load !== latest.load) break;
    run.unshift(ent[i]);
  }
  if (run.length === 1) return { code: "ok", label: "First session at this load", tone: C.muted, streak: 0 };

  let streak = 0;
  let declines = 0;
  for (let i = run.length - 1; i > 0; i--) {
    const now = sum(run[i].reps);
    const prev = sum(run[i - 1].reps);
    if (now > prev) break;
    streak++;
    if (now < prev) declines++;
    else declines = 0;
  }

  if (declines >= 2) return { code: "decline", label: "Declining", tone: C.bad, streak };
  if (streak >= 3) return { code: "plateau", label: "Plateau, " + streak + " sessions", tone: C.bad, streak };
  if (streak === 2) return { code: "stall", label: "Stall, 2 sessions", tone: C.warn, streak };
  if (streak === 1) return { code: "s1", label: "No rep gain last session", tone: C.warn, streak };
  return { code: "ok", label: "Progressing", tone: C.pb, streak: 0 };
}

/**
 * Renders entries as pipe-delimited markdown lines matching the format
 * defined in Gym-Tracker.md, grouped by date and session so it drops
 * straight into Gym.md.
 *
 *   DATE | EXERCISE | LOAD | REPS | RIR | FLAG | NOTE
 */
function buildExport(log) {
  const sets = log.filter((l) => l.type === "set" || l.type === "deload").sort((a, b) => a.ts - b.ts);
  if (sets.length === 0) return "";

  const byDate = {};
  sets.forEach((l) => {
    const ex = BY_ID[l.exId];
    if (!ex) return;
    byDate[l.date] = byDate[l.date] || {};
    byDate[l.date][ex.s] = byDate[l.date][ex.s] || [];
    byDate[l.date][ex.s].push(l);
  });

  const nameWidth = Math.min(36, Math.max.apply(null, sets.map((l) => (BY_ID[l.exId] ? BY_ID[l.exId].name.length : 0))));
  const pad = (s, n) => (s.length >= n ? s.slice(0, n) : s + " ".repeat(n - s.length));

  const out = [];
  Object.keys(byDate).sort().forEach((date) => {
    Object.keys(byDate[date]).forEach((sid) => {
      const s = SESSIONS.find((x) => x.id === sid);
      out.push("### " + date + " \u00b7 " + (s ? s.name : sid));
      out.push("");
      out.push("```");
      byDate[date][sid].forEach((l) => {
        const ex = BY_ID[l.exId];
        if (l.type === "deload") {
          out.push(date + " | " + pad(ex.name, nameWidth) + " | " + pad(fmtLoad(ex, l.load), 8) + " | " + pad("-", 12) + " | - | DL | deload 30%");
          return;
        }
        const flags = l.flags && l.flags.length ? l.flags.join(" ") : "-";
        out.push(
          (date + " | " + pad(ex.name, nameWidth) + " | " + pad(fmtLoad(ex, l.load), 8) + " | " +
            pad(l.reps.join(","), 12) + " | " + (l.rir != null ? l.rir : "-") + " | " + pad(flags, 4) + " | " + (l.note || "")
          ).replace(/\s+$/, "")
        );
      });
      out.push("```");
      out.push("");
    });
  });
  return out.join("\n");
}

/**
 * Advanced URI plugin. The data parameter writes the text straight through,
 * so there is no copy step. Long payloads fall back to clipboard mode
 * because custom protocol handlers have practical URL length limits.
 */
function obsidianURI(settings, text, useClipboard) {
  const vault = (settings.vault || "").trim();
  const filepath = (settings.filepath || "Gym.md").trim();
  const parts = [];
  if (vault) parts.push("vault=" + encodeURIComponent(vault));
  parts.push("filepath=" + encodeURIComponent(filepath));
  parts.push("mode=append");
  if (useClipboard) parts.push("clipboard=true");
  else parts.push("data=" + encodeURIComponent(text));
  return "obsidian://advanced-uri?" + parts.join("&");
}

async function copyText(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) { /* sandboxed contexts block the clipboard API */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch (e) { return false; }
}

function load() {
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem(STORE_KEY) || localStorage.getItem(LEGACY_KEY) || "null");
  } catch (e) { saved = null; }

  const loads = {}, peaks = {};
  PROGRAMME.forEach((e) => {
    const blank = e.unit === "bw" ? 0 : null;   // a bodyweight movement has no load to set
    loads[e.id] = (saved && saved.loads && saved.loads[e.id] != null) ? saved.loads[e.id] : blank;
    peaks[e.id] = (saved && saved.peaks && saved.peaks[e.id] != null) ? saved.peaks[e.id] : blank;
  });

  const log = ((saved && saved.log) || []).map((l) => ({ synced: false, ...l }));

  state = {
    loads, peaks, log,
    bw: ((saved && saved.bw) || []).filter((r) => r && r.date && r.kg > 0),
    whoop: ((saved && saved.whoop) || []).filter((r) => r && r.date),
    settings: Object.assign({ vault: "", filepath: "Gym.md", sex: "male", dbPer: "each", addOnKg: 1.125 }, (saved && saved.settings) || {}),
  };
}

function persist(patch) {
  state = Object.assign({}, state, patch || {});
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
    err = null;
  } catch (e) {
    err = "Storage is full or blocked. Your last entry may not survive a refresh \u2014 append to Obsidian now.";
  }
}

    icon: 'M12 3.2a2.8 2.8 0 1 1 0 5.6 2.8 2.8 0 0 1 0-5.6ZM6 20.5v-4a4.5 4.5 0 0 1 4.5-4.5h3A4.5 4.5 0 0 1 18 16.5v4' },
  { key: "setup", label: "Setup", page: "settings",
    icon: 'M12 8.7a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6ZM12 2.5v2.4M12 19.1v2.4M4.9 5l1.7 1.7M17.4 17.3l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.9 19l1.7-1.7M17.4 6.7l1.7-1.7' },
];

/** Which tab, if any, this page belongs under. A deep page like the
 *  exercise screen keeps its own back arrow and still shows the bar, but
 *  highlights the tab it was reached from rather than nothing at all. */
function activeTabKey() {
  const p = view.page;
  if (p === "home") return "home";
  if (p === "sessions" || p === "session" || p === "exercise") return "log";
  if (p === "trends") return "trends";
  if (p === "body") return "body";
  if (p === "settings" || p === "pins") return "setup";
  return null;
}

function tabBar() {
  const active = activeTabKey();
  return '<nav class="tabbar">' + TABS.map((t) =>
    '<button class="' + (active === t.key ? "active" : "") + '" onclick="go({page:\'' + t.page + '\'})" aria-label="' + esc(t.label) + '">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="' + t.icon + '"/></svg>' +
      "<span>" + esc(t.label) + "</span></button>"
  ).join("") + "</nav>";
}

function shell(inner) {
  document.getElementById("app").innerHTML = '<div class="wrap">' + inner + "</div>" + tabBar();
}

/* ----------------------------------------------------------------
   Sync prompt, shown when a session has entries not yet in Obsidian
------------------------------------------------------------------*/
function syncBanner() {
  const p = pending();
  if (p.length === 0) return "";
  const dates = Array.from(new Set(p.map((l) => l.date))).sort();
  const when = dates.length === 1
    ? (dates[0] === today() ? "today" : dates[0])
    : dates.length + " sessions";
  return '<div class="sync">' +
    "<h3>" + p.length + " entr" + (p.length === 1 ? "y" : "ies") + " not in Obsidian yet</h3>" +
    '<div class="body-copy" style="margin-bottom:14px">Logged ' + esc(when) + ". Append them to " + esc(state.settings.filepath || "Gym.md") + " to make the note the durable record.</div>" +
    '<button class="btn-quiet" onclick="go({page:\'sync\'})">Append to Obsidian</button>' +
    "</div>";
}

/* ----------------------------------------------------------------
   Pages
------------------------------------------------------------------*/
function render() {
  if (view.page === "home") return renderDash();
  if (view.page === "sessions") return renderSessions();
  if (view.page === "pins") return renderPins();
  if (view.page === "session") return renderSession();
  if (view.page === "exercise") return renderExercise();
  if (view.page === "pb") return renderPB();
  if (view.page === "log") return renderLog();
  if (view.page === "sync") return renderSync();
  if (view.page === "trends") return renderTrends();
  if (view.page === "body") return renderBody();
  if (view.page === "whoop") return renderWhoop();
  if (view.page === "settings") return renderSettings();
  return renderDash();
}

/** How long since a session was trained, in words. */
function sessionGap(sid) {
  const d = sessionLastDone(sid);
  if (!d) return "never logged";
  const n = daysBetween(d, today());
  return n === 0 ? "done today" : n === 1 ? "done yesterday" : "last done " + n + " days ago";
}

/** The session picker. This was the landing page until the dashboard took
 *  that job; it is now one tap away and keeps the flagged-lift pills, which
 *  are what you actually want when choosing what to train. */
function renderSessions() {
  const recent = state.log.slice().sort((a, b) => b.ts - a.ts).slice(0, 5);
  const next = nextSession();

  let h = backBar("go({page:'home'})", "Sessions",
    "Upper/Lower · double progression, " + PROGRAMME[0].lo + "–" + PROGRAMME[0].hi + " reps, then load");

  if (err) h += '<div class="note err">' + esc(err) + "</div>";
  h += syncBanner();

  SESSIONS.forEach((s) => {
    const exs = PROGRAMME.filter((e) => e.s === s.id);
    const flagged = exs.filter((e) => ["stall", "plateau", "decline"].indexOf(statusFor(e.id, state.log).code) >= 0).length;
    h += '<button class="card" onclick="go({page:\'session\',sid:\'' + s.id + '\'})">' +
      '<div class="row"><div>' +
      '<div class="name">' + esc(s.name) + (next.s.id === s.id ? " " + pill("next", C.accent) : "") + "</div>" +
      '<div class="meta">' + esc(sessionGap(s.id)) + " · " + exs.length + " exercises</div>" +
      "</div>" +
      (flagged > 0 ? pill(flagged + " flagged", C.warn) : '<span class="chev">›</span>') +
      "</div></button>";
  });

  h += '<div class="stack" style="margin-top:18px">' +
    '<button class="btn-secondary" onclick="go({page:\'pb\'})">PB register</button>' +
    '<button class="btn-secondary" onclick="go({page:\'log\'})">Full log</button>' +
    '<button class="btn-secondary auto" onclick="go({page:\'settings\'})">Setup</button>' +
    "</div>";

  if (recent.length) {
    h += '<div class="mt-lg"><div class="body-copy" style="margin-bottom:10px">Last few entries</div>';
    recent.forEach((l) => {
      const ex = BY_ID[l.exId];
      h += '<div class="list-row"><span>' + esc(ex ? ex.name : l.exId) + "</span>" +
        '<span style="color:var(--muted)">' + esc(l.date) + " · " +
        (l.type === "deload" ? "Deload" : esc(fmtLoad(ex, l.load) + " · " + l.reps.join(","))) +
        (l.synced ? "" : ' <span style="color:var(--accent)">●</span>') +
        "</span></div>";
    });
    h += "</div>";
  }

  shell(h);
}

function renderSession() {
  const s = SESSIONS.find((x) => x.id === view.sid);
  const exs = PROGRAMME.filter((e) => e.s === s.id);
  const p = pending().filter((l) => BY_ID[l.exId] && BY_ID[l.exId].s === s.id);

  let h = backBar("go({page:'sessions'})", s.name, sessionGap(s.id));

  exs.forEach((e) => {
    const st = statusFor(e.id, state.log);
    const load = state.loads[e.id];
    const pk = state.peaks[e.id];
    const atPB = load != null && pk != null && load >= pk;
    const alarm = st.code === "plateau" || st.code === "decline";
    h += '<button class="card tight' + (alarm ? " alarm" : "") + '" onclick="go({page:\'exercise\',exId:\'' + e.id + '\'})">' +
      '<div class="row baseline">' +
      '<div class="name sm">' + esc(e.name) + (e.opt ? ' <span class="opt">(if time)</span>' : "") + "</div>" +
      '<div class="load">' + esc(fmtLoad(e, load)) + "</div>" +
      "</div>" +
      '<div class="stack" style="margin-top:8px;gap:8px;align-items:center">' +
      '<span style="font-size:12px;color:var(--muted)">' + e.sets + " \u00d7 " + e.lo + "\u2013" + e.hi + (e.repUnit === "sec" ? "s" : "") + "</span>" +
      (pk != null && !atPB ? pill(fmtLoad(e, pk) + " peak", C.muted) : "") +
      (st.code !== "new" && st.code !== "ok" ? pill(st.label, st.tone) : "") +
      "</div></button>";
  });

  if (p.length) {
    h += '<div class="sync" style="margin-top:18px">' +
      "<h3>Done for today?</h3>" +
      '<div class="body-copy" style="margin-bottom:14px">' + p.length + " entr" + (p.length === 1 ? "y" : "ies") + " from this session are waiting to go into " + esc(state.settings.filepath || "Gym.md") + ".</div>" +
      '<button class="btn-quiet" onclick="go({page:\'sync\'})">Finish and append</button>' +
      "</div>";
  }

  shell(h);
}

function renderExercise() {
  const ex = BY_ID[view.exId];
  const target = state.loads[ex.id];
  const peak = state.peaks[ex.id];
  const st = statusFor(ex.id, state.log);

  const sets = state.log.filter((l) => l.exId === ex.id && l.type === "set").sort((a, b) => b.ts - a.ts);
  const lastSet = sets[0] || null;
  // The most recent session at this exact load is the one that matters for
  // double progression: you are trying to beat it.
  const lastAtLoad = sets.find((l) => l.load === target) || null;

  if (!draft) {
    const src = lastAtLoad || lastSet;
    const reps = Array(ex.sets).fill(ex.lo).map((d, i) => {
      if (!src) return d;
      return src.reps[i] !== undefined ? src.reps[i] : (src.reps[src.reps.length - 1] !== undefined ? src.reps[src.reps.length - 1] : d);
    });
    draft = { reps: reps, rir: lastSet && lastSet.rir != null ? lastSet.rir : 1, load: target == null ? "" : String(target), formReset: false, note: "" };
  }

  const history = state.log.filter((l) => l.exId === ex.id).sort((a, b) => b.ts - a.ts).slice(0, 6);
  const loadNum = parseFloat(draft.load);
  const effLoad = ex.unit === "bw" ? 0 : loadNum;
  const valid = !isNaN(loadNum) || ex.unit === "bw";
  const allTop = draft.reps.every((r) => r >= ex.hi);
  const isPB = ex.unit !== "bw" && (peak == null || effLoad > peak) && !draft.formReset;

  let h = backBar("go({page:'session',sid:'" + ex.s + "'})", ex.name, SESSIONS.find((s) => s.id === ex.s).name);

  // Target
  h += '<div class="panel" style="padding:20px 18px;margin-bottom:14px">' +
    '<div class="panel-label" style="margin-bottom:8px">Target today</div>' +
    '<div style="display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap">' +
    '<div style="font-size:52px;font-weight:700;line-height:1;color:var(--accent);letter-spacing:-1.5px">' +
    (ex.unit === "bw" ? "BW" : target == null ? "\u2013\u2013" : ex.unit === "pin" ? '"' + fmtPin(target) + '"' : Number(target.toFixed(2))) +
    "</div>" +
    '<div style="font-size:16px;color:var(--muted);padding-bottom:6px">' +
    (ex.unit === "kg" ? "kg" : ex.unit === "pin" ? "pin" : "") + " \u00b7 " + ex.sets + " \u00d7 " + ex.lo + "\u2013" + ex.hi + (ex.repUnit === "sec" ? " sec" : "") +
    "</div></div>" +
    '<div class="stack" style="margin-top:12px;gap:8px">' +
    (target != null && peak != null && target < peak ? pill("Peak " + fmtLoad(ex, peak), C.warn) : "") +
    (target != null && peak != null && target >= peak && ex.unit !== "bw" ? pill("At peak", C.pb) : "") +
    (target == null && ex.unit !== "bw" ? pill("No load set yet", C.warn) : "") +
    (st.code !== "new" ? pill(st.label, st.tone) : "") +
    "</div>" +
    ((st.code === "plateau" || st.code === "decline")
      ? '<div class="body-copy" style="margin-top:12px">Three sessions without a rep gain. Options are a deload, or leaving it and watching whether other lifts in this session follow.</div>'
      : "") +
    "</div>";

  // Load
  h += '<div class="panel"><div class="panel-label">Weight actually used</div>' +
    '<div style="display:flex;align-items:center;gap:10px">' +
    '<button class="round" aria-label="Decrease load" onclick="bumpLoad(-1)">\u2212</button>' +
    '<input class="load-input" id="loadInput" type="number" step="any" inputmode="decimal" value="' + esc(draft.load) + '"' +
    (ex.unit === "bw" ? " disabled" : "") + ' oninput="onLoadInput(this.value)">' +
    '<button class="round" aria-label="Increase load" onclick="bumpLoad(1)">+</button>' +
    "</div>" +
    '<div class="hint" id="loadHint">' +
    (ex.unit === "pin" ? "Cable pin position. Use .5 for a half step, shown as \u201c+\u201d."
      : ex.unit === "bw" ? "Bodyweight movement."
        : "Steps of " + ex.inc + "kg.") +
    (isPB && peak != null ? ' <span style="color:var(--pb);font-weight:600">Above your peak of ' + esc(fmtLoad(ex, peak)) + ".</span>" : "") +
    "</div></div>";

  // Reps
  h += '<div class="panel"><div class="panel-label">' + (ex.repUnit === "sec" ? "Seconds per set" : "Reps per set") + "</div>";
  if (lastAtLoad) {
    h += '<div class="body-copy" style="margin-bottom:14px">Starting from last session at ' + esc(fmtLoad(ex, target)) + ", " + esc(lastAtLoad.date) +
      ': <span style="color:var(--text);font-weight:600">' + esc(lastAtLoad.reps.join(", ")) + "</span>. Beat any one set to progress.</div>";
  } else if (lastSet) {
    h += '<div class="body-copy" style="margin-bottom:14px">First session at ' + esc(fmtLoad(ex, target)) + ". Carried over from " + esc(fmtLoad(ex, lastSet.load)) + " on " + esc(lastSet.date) +
      ': <span style="color:var(--text);font-weight:600">' + esc(lastSet.reps.join(", ")) + "</span>.</div>";
  } else {
    h += '<div class="body-copy" style="margin-bottom:14px">No history yet. Starting at the bottom of the range.</div>';
  }

  draft.reps.forEach((r, i) => {
    const prev = lastAtLoad ? lastAtLoad.reps[i] : undefined;
    const delta = prev === undefined ? null : r - prev;
    const tone = delta === null ? "var(--muted)" : delta > 0 ? "var(--pb)" : delta < 0 ? "var(--bad)" : "var(--muted)";
    const label = delta === null
      ? (r >= ex.hi ? "top" : r >= ex.lo ? "in range" : "under")
      : delta === 0 ? "= " + prev : (delta > 0 ? "+" : "") + delta;
    h += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">' +
      '<span style="font-size:14px;color:var(--muted);width:62px">Set ' + (i + 1) + "</span>" +
      stepper("rep" + i, r, 0, ex.repUnit === "sec" ? 180 : 60, true) +
      '<span id="delta' + i + '" style="width:62px;text-align:right;font-size:13px;color:' + tone + '">' + esc(label) + "</span>" +
      "</div>";
  });

  h += '<div class="stack" style="margin-top:10px;gap:8px">' +
    (lastAtLoad ? '<button class="btn-mini" onclick="resetReps()">Reset to last session</button>' : "") +
    '<button class="btn-mini" onclick="fillReps(' + ex.lo + ')">All ' + ex.lo + "</button>" +
    '<button class="btn-mini" onclick="fillReps(' + ex.hi + ')">All ' + ex.hi + "</button>" +
    "</div>";

  if (allTop) {
    h += '<div style="margin-top:12px;font-size:13px;color:var(--pb);line-height:1.5">Every set at ' + ex.hi +
      ". Next session goes to " + esc(fmtLoad(ex, roundToInc(effLoad + (ex.inc || 1), ex.inc || 1))) + ".</div>";
  }
  h += "</div>";

  // RIR and flags
  h += '<div class="panel"><div class="panel-label">Reps in reserve on the last set</div>' +
    stepper("rirVal", draft.rir, 0, 5, false) +
    '<label class="check"><input type="checkbox" ' + (draft.formReset ? "checked" : "") + ' onchange="draft.formReset=this.checked;render()">' +
    '<span>Deliberate form reset<span style="color:var(--muted)"> \u00b7 logs as F, not a failure</span></span></label>' +
    '<input class="field" style="margin-top:14px" value="' + esc(draft.note) + '" placeholder="Note, optional" oninput="draft.note=this.value">' +
    "</div>";

  h += '<div class="stack" style="margin-top:18px;flex-wrap:nowrap">' +
    '<button class="btn-primary" ' + (valid ? "" : "disabled ") + 'onclick="saveSet()">Save set</button>' +
    '<button class="btn-secondary warn auto" onclick="deload()">Deload 30%</button>' +
    "</div>" +
    (target == null
      ? '<div class="hint">No working load set for this lift yet. Type what you actually used and save a set; that becomes the load and the baseline everything else is measured from.</div>'
      : '<div class="hint">Deload drops the working load to ' + esc(fmtLoad(ex, roundToInc(target * 0.7, ex.inc || 1))) +
        " and leaves your peak untouched" + (peak == null ? "." : ", so a future return to " + esc(fmtLoad(ex, peak)) + " still counts as re-attainment rather than a PB.") + "</div>");

  if (history.length) {
    h += '<div class="mt-lg"><div class="body-copy" style="margin-bottom:10px">Recent sessions</div>';
    history.forEach((l) => {
      h += '<div class="list-row"><span style="color:var(--muted)">' + esc(l.date) + "</span><span>" +
        (l.type === "deload"
          ? '<span style="color:var(--warn)">Deload to ' + esc(fmtLoad(ex, l.load)) + "</span>"
          : esc(fmtLoad(ex, l.load)) + " \u00b7 " + esc(l.reps.join(",")) +
            (l.flags && l.flags.length ? ' <span style="color:var(--accent)">' + esc(l.flags.join(" ")) + "</span>" : "")) +
        "</span></div>";
    });
    h += "</div>";
  }

  shell(h);
}

function renderPB() {
  let h = backBar("go({page:'home'})", "PB register", "New PBs are measured against peak, not current");
  SESSIONS.forEach((s) => {
    h += '<div class="mb-lg"><div class="group-head">' + esc(s.name) + "</div>";
    PROGRAMME.filter((e) => e.s === s.id).forEach((e) => {
      const cur = state.loads[e.id], pk = state.peaks[e.id];
      const gap = cur == null || pk == null ? null : pk - cur;
      h += '<div class="list-row"><span style="flex:1">' + esc(e.name) + "</span>" +
        '<span style="width:82px;text-align:right;color:var(--muted)">' + esc(fmtLoad(e, pk)) + "</span>" +
        '<span style="width:82px;text-align:right;font-weight:600;color:' + (gap == null ? "var(--muted)" : gap > 0 ? "var(--warn)" : "var(--pb)") + '">' + esc(fmtLoad(e, cur)) + "</span></div>";
    });
    h += "</div>";
  });
  h += '<div class="hint">Left column is peak. Right column is current working load. Amber means below peak, so the first job on that lift is re-attainment rather than a new record.</div>';
  shell(h);
}

function renderLog() {
  const rows = state.log.slice().sort((a, b) => b.ts - a.ts);
  const p = pending();
  let h = backBar("go({page:'home'})", "Full log", rows.length + " entries, " + p.length + " not yet in Obsidian");

  if (rows.length === 0) {
    h += '<div class="panel"><div class="body-copy">Nothing logged yet. Pick a session from the home screen and save your first set.</div></div>';
    shell(h);
    return;
  }

  h += syncBanner();

  h += '<div class="panel">' +
    '<div style="font-size:15px;font-weight:600;margin-bottom:6px">Send everything again</div>' +
    '<div class="body-copy" style="margin-bottom:14px">Appends the whole log, including entries already written. Useful for rebuilding Gym.md from scratch after a lost note.</div>' +
    '<div class="stack">' +
    '<button class="btn-secondary auto" onclick="go({page:\'sync\',all:true})">Append full log</button>' +
    '<button class="btn-secondary auto" onclick="toggleExport()">' + (exportOpen ? "Hide text" : "Show text") + "</button>" +
    "</div>" +
    (exportOpen ? '<pre class="export">' + esc(buildExport(state.log)) + "</pre>" : "") +
    "</div>";

  rows.forEach((l) => {
    const ex = BY_ID[l.exId];
    h += '<div class="list-row"><span>' + esc(ex ? ex.name : l.exId) + (l.synced ? "" : ' <span style="color:var(--accent)">\u25cf</span>') + "</span>" +
      '<span style="color:var(--muted);text-align:right">' + esc(l.date) + " \u00b7 " +
      (l.type === "deload" ? "Deload to " + esc(fmtLoad(ex, l.load)) : esc(fmtLoad(ex, l.load) + " \u00b7 " + l.reps.join(","))) +
      "</span></div>";
  });

  h += '<div class="hint">A dot marks an entry that has not been appended to Obsidian yet.</div>';
  shell(h);
}

function renderSync() {
  const all = !!view.all;
  const entries = all ? state.log : pending();
  const text = buildExport(entries);
  const vault = state.settings.vault || "";
  const filepath = state.settings.filepath || "Gym.md";

  let h = backBar("go({page:'home'})", all ? "Append full log" : "Append to Obsidian",
    entries.length + " entr" + (entries.length === 1 ? "y" : "ies") + " \u2192 " + filepath);

  if (entries.length === 0) {
    h += '<div class="panel"><div class="body-copy">Everything is already in Obsidian. Log a session and come back.</div></div>';
    shell(h);
    return;
  }

  const uri = obsidianURI(state.settings, text, false);
  const tooLong = uri.length > URI_BUDGET;

  if (!vault) {
    h += '<div class="note" style="border-color:var(--warn-edge);background:var(--warn-tint)">' +
      '<strong style="color:var(--warn)">No vault name set.</strong> Obsidian will guess at your last-used vault, which is fine if you only have one. Set it under Setup to be certain.</div>';
  }

  h += '<div class="panel">' +
    '<div style="font-size:15px;font-weight:600;margin-bottom:6px">' + (tooLong ? "Copy, then append" : "One tap, no copying") + "</div>" +
    '<div class="body-copy" style="margin-bottom:14px">' +
    (tooLong
      ? "This batch is too large to travel inside a link, so it goes via the clipboard instead. Copy first, then append."
      : "Opens Obsidian and appends these lines to " + esc(filepath) + " directly. Needs the Advanced URI community plugin installed in your vault.") +
    "</div>";

  if (tooLong) {
    h += '<div class="stack" style="margin-bottom:12px">' +
      '<button class="btn-primary auto" onclick="copyForClipboardMode()">Copy log</button>' +
      "</div>" +
      '<a class="btn-secondary" href="' + esc(obsidianURI(state.settings, "", true)) + '" onclick="markSent()">Append copied text</a>';
  } else {
    h += '<a class="btn-primary" href="' + esc(uri) + '" onclick="markSent()">Append ' + entries.length + " entr" + (entries.length === 1 ? "y" : "ies") + "</a>";
  }
  h += "</div>";

  if (awaitingConfirm) {
    h += '<div class="sync">' +
      "<h3>Did it land in " + esc(filepath) + "?</h3>" +
      '<div class="body-copy" style="margin-bottom:14px">This page cannot see inside Obsidian, so confirm and these entries stop being offered.</div>' +
      '<div class="stack">' +
      '<button class="btn-primary auto" onclick="confirmSynced(' + (all ? "true" : "false") + ')">Yes, mark as appended</button>' +
      '<button class="btn-secondary auto" onclick="awaitingConfirm=false;render()">Not yet</button>' +
      "</div></div>";
  }

  h += '<div class="panel">' +
    '<div class="panel-label">What gets written</div>' +
    '<pre class="export">' + esc(text) + "</pre>" +
    '<div class="stack" style="margin-top:12px">' +
    '<button class="btn-mini" onclick="copyPlain()">Copy text</button>' +
    '<button class="btn-mini" onclick="go({page:\'settings\'})">Vault settings</button>' +
    "</div></div>";

  shell(h);
}

function renderSettings() {
  let h = backBar("go({page:'home'})", "Setup", "Version " + VERSION);

  h += '<div class="panel">' +
    '<div class="panel-label">Obsidian vault</div>' +
    '<div class="stack" style="margin-bottom:10px">' +
    '<input class="field half" value="' + esc(state.settings.vault) + '" placeholder="Vault name" oninput="setSetting(\'vault\',this.value)">' +

  h += '<div class="panel">' +

    '<option value="each"' + (state.settings.dbPer !== "total" ? " selected" : "") + ">Dumbbells: weight of one (confirmed)</option>" +

    '<div class="stack" style="margin-top:14px"><button class="btn-secondary auto" onclick="go({page:\'pins\'})">Cable stacks' +
    (function () { const n = PROGRAMME.filter((e) => e.unit === "pin" && pinToKg(e, 1) == null).length;

    '<div class="stack">' +

  h += '<div class="panel">' +

}
function stepBy(id, dir, min, max) {
  if (id === "rirVal") {
    draft.rir = Math.min(max, Math.max(min, draft.rir + dir));
  } else {
    const i = parseInt(id.replace("rep", ""), 10);
    draft.reps[i] = Math.min(max, Math.max(min, draft.reps[i] + dir));
  }
  render();
}
window.stepBy = stepBy;

function onLoadInput(v) { draft.load = v; }
window.onLoadInput = onLoadInput;

function bumpLoad(dir) {
  const ex = BY_ID[view.exId];
  const inc = ex.inc || 1;
  const cur = parseFloat(draft.load);
  const stored = state.loads[ex.id];
  const from = isNaN(cur) ? (stored == null ? 0 : stored) : cur;
  const v = Math.max(0, from + dir * inc);
  draft.load = String(Number(v.toFixed(2)));
  render();
}
window.bumpLoad = bumpLoad;

function fillReps(n) { draft.reps = draft.reps.map(() => n); render(); }
window.fillReps = fillReps;

function resetReps() {
  const ex = BY_ID[view.exId];
  const target = state.loads[ex.id];
  const src = state.log.filter((l) => l.exId === ex.id && l.type === "set" && l.load === target).sort((a, b) => b.ts - a.ts)[0];
  if (src) draft.reps = draft.reps.map((d, i) => (src.reps[i] !== undefined ? src.reps[i] : d));
  render();
}
window.resetReps = resetReps;

function saveSet() {
  const ex = BY_ID[view.exId];
  const peak = state.peaks[ex.id];
  const loadNum = parseFloat(draft.load);
  if (isNaN(loadNum) && ex.unit !== "bw") return;
  const effLoad = ex.unit === "bw" ? 0 : loadNum;
  const allTop = draft.reps.every((r) => r >= ex.hi);
  const isPB = ex.unit !== "bw" && effLoad > peak && !draft.formReset;

  const flags = [];
  if (draft.formReset) flags.push("F");
  if (isPB) flags.push("PB");
  if (allTop) flags.push("UP");

  const entry = {
    type: "set", exId: ex.id, date: today(), ts: Date.now(),
    load: effLoad, reps: draft.reps.slice(), rir: draft.rir,
    formReset: draft.formReset, note: draft.note.trim(), flags: flags, synced: false,
  };

  persist({
    loads: Object.assign({}, state.loads, { [ex.id]: effLoad }),
    peaks: Object.assign({}, state.peaks, { [ex.id]: peak == null ? effLoad : Math.max(peak, effLoad) }),
    log: state.log.concat([entry]),
  });

  flash(isPB ? "New PB. " + fmtLoad(ex, effLoad) : allTop ? "Logged. Ready to move up" : "Logged");
  go({ page: "session", sid: ex.s });
}
window.saveSet = saveSet;

function deload() {

  const target = state.loads[ex.id];
  if (target == null) { flash("Nothing to deload yet, save a set first"); return; }
  const nl = roundToInc(target * (1 - DELOAD_PCT), ex.inc || 1);
  if (!confirm("Deload " + ex.name + " by 30%, from " + fmtLoad(ex, target) + " to " + fmtLoad(ex, nl) + "?")) return;
  persist({
    loads: Object.assign({}, state.loads, { [ex.id]: nl }),

function restoreBackup(input) {
  const file = input.files && input.files[0];
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || !Array.isArray(d.log)) throw new Error("bad file");
      persist({
        loads: Object.assign({}, state.loads, d.loads || {}),
        peaks: Object.assign({}, state.peaks, d.peaks || {}),
        log: d.log,
        bw: Array.isArray(d.bw) ? d.bw : state.bw,
        whoop: Array.isArray(d.whoop) ? d.whoop : state.whoop,
        settings: Object.assign({}, state.settings, d.settings || {}),
      });
      flash("Restored " + d.log.length + " entries");
      go({ page: "home" });
    } catch (e) {
      flash("That file is not a gym log backup");
    }
  };
  r.readAsText(file);
}
