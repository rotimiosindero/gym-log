/* ================================================================
   PROGRESS ENGINE

   Two different questions, two different numbers, because conflating
   them would make both untrustworthy.

   Strength index   -- every lift against its own programme starting
                       load. 100 is where you began. Works for cable
                       pins and bodyweight moves, assumes nothing about
                       the outside world, and is the number to trust.

   Strength standard -- bodyweight multiples against published
                       standards, 0-100. Only the eleven barbell and
                       dumbbell lifts feed it, because a pin position
                       has no kilos in it and one maker's machine plate
                       is another's half. An estimate, labelled as one.
================================================================= */

const DAY = 864e5;
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

const dstr = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
const parseD = (s) => new Date(s + "T00:00:00");
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return dstr(d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / DAY);
const fmtDay = (s) => { const d = parseD(s); return d.getDate() + " " + MONTHS[d.getMonth()]; };
const weekStart = (s) => { const d = parseD(s); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return dstr(d); };
const n1 = (v) => Number(v.toFixed(1));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---- bodyweight ---------------------------------------------- */
const bwSorted = () => state.bw.slice().sort((a, b) => a.date.localeCompare(b.date));

/** Bodyweight in effect on a date. Before the first weigh-in it uses the
 *  first one, which is better than a zero that would silently blank every
 *  bodyweight-relative number on the page. */
function bwOn(date) {
  const b = bwSorted();
  if (!b.length) return 0;
  let v = null;
  for (let i = 0; i < b.length; i++) { if (b[i].date <= date) v = b[i].kg; else break; }
  return v == null ? b[0].kg : v;
}
const bwLatest = () => { const b = bwSorted(); return b.length ? b[b.length - 1] : null; };

/** Change over the last n days, or null if there is nothing that old. */
function bwDelta(days) {
  const b = bwSorted();
  if (b.length < 2) return null;
  const cut = addDays(today(), -days);
  if (b[0].date > cut) return null;
  return b[b.length - 1].kg - bwOn(cut);
}

/* ---- estimated one-rep max ----------------------------------- */
/** Epley, on the best set of the entry. For a bodyweight movement there is
 *  no load to scale, so reps stand in for it. */
function entryE1(ex, l) {
  if (!l.reps || !l.reps.length) return 0;
  const reps = Math.max.apply(null, l.reps);
  if (reps <= 0) return 0;
  if (ex.unit === "bw") return reps;
  return l.load * (1 + Math.min(reps, REP_CAP) / 30);
}

/** The baseline a lift is measured against: the first set you ever logged for
 *  it. It used to be the load written into the programme, but those came out
 *  of the source because the repository is public. Your own first session is a
 *  better mark anyway, and it is equally fixed, so the index still does not
 *  shift under you as you log. A lift with no history has no baseline and is
 *  simply left out. */
function baseE1(ex) {
  const sets = state.log.filter((l) => l.type === "set" && l.exId === ex.id && l.reps && l.reps.length);
  if (!sets.length) return 0;
  const first = sets.slice().sort((a, b) => a.date.localeCompare(b.date) || a.ts - b.ts)[0];
  return entryE1(ex, first);
}

/** Best e1RM for one lift as at a date. Prefers the recency window; falls
 *  back to all-time and says so, rather than reporting nothing. */
function exBest(exId, asOf) {
  const ex = BY_ID[exId];
  if (!ex) return null;
  const sets = state.log.filter((l) => l.type === "set" && l.exId === exId && l.date <= asOf);
  if (!sets.length) return null;
  let best = 0, bestDate = null;
  sets.forEach((l) => {
    if (daysBetween(l.date, asOf) > WINDOW_DAYS) return;
    const v = entryE1(ex, l);
    if (v > best) { best = v; bestDate = l.date; }
  });
  const stale = best === 0;
  if (stale) sets.forEach((l) => { const v = entryE1(ex, l); if (v > best) { best = v; bestDate = l.date; } });
  const last = sets.map((l) => l.date).sort().pop();
  return { best: best, bestDate: bestDate, stale: stale, last: last, n: sets.length };
}

/** Index for one lift: current best over the programme baseline. */
function exIndex(exId, asOf) {
  const ex = BY_ID[exId];
  const b = exBest(exId, asOf);
  if (!b || !b.best) return null;
  const base = baseE1(ex);
  if (!base) return null;
  return { idx: (b.best / base) * 100, best: b.best, base: base, stale: b.stale, last: b.last, bestDate: b.bestDate };
}

/** Index per muscle group: the mean across its lifts that have data, so six
 *  leg exercises do not outvote six arm exercises at the group level. */
function groupIndex(asOf) {
  const out = {};
  Object.keys(MG).concat(SUPPORT_ORDER).forEach((g) => {
    const rows = PROGRAMME.filter((e) => e.mg === g)
      .map((e) => Object.assign({ ex: e }, exIndex(e.id, asOf) || {}))
      .filter((r) => r.idx != null);
    const idx = rows.length ? rows.reduce((a, r) => a + r.idx, 0) / rows.length : null;
    const lastDates = rows.map((r) => r.last).filter(Boolean).sort();
    out[g] = {
      idx: idx, rows: rows, n: rows.length,
      total: PROGRAMME.filter((e) => e.mg === g).length,
      last: lastDates.length ? lastDates[lastDates.length - 1] : null,
      stale: rows.length > 0 && rows.every((r) => r.stale),
    };
  });
  return out;
}

/** Overall strength: the mean of the five group indices. Coverage rides
 *  alongside it, because 112 off two groups is not the same claim as 112
 *  off five. */
function overallIndex(gi) {
  const live = MG_ORDER.map((g) => gi[g]).filter((r) => r.idx != null);
  if (!live.length) return { idx: null, cov: 0, missing: MG_ORDER.map((g) => MG[g].label) };
  const idx = live.reduce((a, r) => a + r.idx, 0) / live.length;
  const sorted = MG_ORDER.filter((g) => gi[g].idx != null).sort((a, b) => gi[a].idx - gi[b].idx);
  return {
    idx: idx, cov: live.length,
    missing: MG_ORDER.filter((g) => gi[g].idx == null).map((g) => MG[g].label),
    weakest: MG[sorted[0]].label, strongest: MG[sorted[sorted.length - 1]].label,
    spread: gi[sorted[sorted.length - 1]].idx - gi[sorted[0]].idx,
  };
}

/* ---- strength standard --------------------------------------- */
function scoreFromMultiple(m, std) {
  const xs = [0].concat(std), ys = [0, 25, 50, 75, 100];
  if (m <= 0) return 0;
  for (let i = 1; i < xs.length; i++) {
    if (m <= xs[i]) return ys[i - 1] + ((m - xs[i - 1]) / (xs[i] - xs[i - 1])) * (ys[i] - ys[i - 1]);
  }
  return 100 + (m - xs[4]) * (25 / (xs[4] - xs[3]));
}

function levelName(s) {
  if (s < 12) return "Untrained";
  if (s < 25) return "Beginner";
  if (s < 50) return "Novice";
  if (s < 75) return "Intermediate";
  if (s < 100) return "Advanced";
  return "Elite";
}

/** Best anchor-equivalent one-rep max for a group: what a bent-over row,
 *  overhead press, bench, curl or squat this result implies. */
function stdBestFor(mg, asOf, bw) {
  let best = 0, from = null;
  const per = [];
  PROGRAMME.filter((e) => e.mg === mg && e.std).forEach((e) => {
    let liftBest = 0;
    state.log.forEach((l) => {
      if (l.type !== "set" || l.exId !== e.id || l.date > asOf) return;
      if (daysBetween(l.date, asOf) > WINDOW_DAYS) return;
      if (!l.reps || !l.reps.length) return;
      const reps = Math.min(Math.max.apply(null, l.reps), REP_CAP);
      if (reps <= 0) return;
      let load;
      if (e.unit === "pin") {
        /* No cable lift carries a `std` entry today (see the note under STD),
           so nothing reaches this branch. It stays because the calibration is
           already in place if one is ever judged reliable enough to count. */
        const k = pinToKg(e, l.load);
        if (k == null) return;
        load = k;
      } else {
        load = l.load * (e.db && state.settings.dbPer !== "total" ? 2 : 1);
      }
      if (e.std.bwf) load += e.std.bwf * bw;
      const eq = (load * (1 + reps / 30)) / e.std.r;
      if (eq > liftBest) liftBest = eq;
      if (eq > best) { best = eq; from = e.name; }
    });
    if (liftBest > 0) per.push({ name: e.name, eq: liftBest, r: e.std.r });
  });
  per.sort((a, b) => a.eq - b.eq);
  return {
    best: best, from: from, stale: best === 0,
    /* Every eligible lift's own estimate of the group's benchmark. When
       these disagree the score is soft, and the reader should see that
       rather than a confident single number built on the highest one. */
    lifts: per,
    low: per.length ? per[0].eq : 0,
    lowFrom: per.length ? per[0].name : null,
  };
}

function stdScores(asOf) {
  const bw = bwOn(asOf);
  const f = SEX_FACTOR[state.settings.sex === "female" ? "female" : "male"];
  const out = {};
  MG_ORDER.forEach((mg) => {
    const b = stdBestFor(mg, asOf, bw);
    const std = MG[mg].std.map((v) => v * f[mg]);
    const mult = bw > 0 ? b.best / bw : 0;
    const lowMult = bw > 0 ? b.low / bw : 0;
    const score = b.stale || !bw ? null : clamp(scoreFromMultiple(mult, std), 0, 100);
    const scoreLow = b.stale || !bw ? null : clamp(scoreFromMultiple(lowMult, std), 0, 100);
    out[mg] = Object.assign({}, b, {
      std: std, mult: mult, lowMult: lowMult,
      eligible: PROGRAMME.filter((e) => e.mg === mg && e.std).length,
      score: score, scoreLow: scoreLow,
      /* One lift means nothing cross-checks it. A wide spread means the
         conversion ratios disagree about you. Either way the reader is
         told, instead of being handed a number that looks solid. */
      confidence: b.stale ? null
        : b.lifts.length < 2 ? "single"
        : (score - scoreLow) > 20 ? "wide" : "ok",
    });
  });
  return out;
}

function overallStd(ss) {
  const live = MG_ORDER.map((g) => ss[g]).filter((r) => r.score != null);
  if (!live.length) return { score: null, cov: 0 };
  const score = live.reduce((a, r) => a + r.score, 0) / live.length;
  return { score: score, cov: live.length, level: levelName(score) };
}

/** Strength to bodyweight: the five anchor-equivalents added up, over
 *  bodyweight. No standards table in it, so it is the honest number to
 *  watch through a bulk or a cut -- it moves only if you lift more or
 *  weigh less. */
function strengthToWeight(ss, bw) {
  const total = MG_ORDER.reduce((a, g) => a + (ss[g].best || 0), 0);
  return {
    total: total,
    ratio: bw > 0 ? total / bw : null,
    complete: MG_ORDER.every((g) => !ss[g].stale),
    missing: MG_ORDER.filter((g) => ss[g].stale).map((g) => MG[g].label),
  };
}

/* ---- days at the gym ----------------------------------------- */
const trainDates = () => Array.from(new Set(state.log.filter((l) => l.type === "set").map((l) => l.date))).sort();

function gymStats() {
  const ds = trainDates(), t = today();
  if (!ds.length) return { total: 0, week: 0, month: 0, last28: 0, streak: 0, perWeek: 0, gap: null, first: null };
  const inLast = (n) => ds.filter((d) => daysBetween(d, t) < n).length;
  const weeks = new Set(ds.map(weekStart));
  let streak = 0, cur = weeks.has(weekStart(t)) ? weekStart(t) : addDays(weekStart(t), -7);
  while (weeks.has(cur)) { streak++; cur = addDays(cur, -7); }
  const span = Math.max(1, daysBetween(ds[0], t) + 1);
  return {
    total: ds.length,
    week: ds.filter((d) => weekStart(d) === weekStart(t)).length,
    month: ds.filter((d) => d.slice(0, 7) === t.slice(0, 7)).length,
    last28: inLast(28),
    streak: streak,
    perWeek: inLast(84) / Math.min(12, Math.ceil(span / 7)),
    gap: daysBetween(ds[ds.length - 1], t),
    first: ds[0],
  };
}

/** Sessions and tonnage by week. Tonnage counts only kg lifts: adding a
 *  cable pin number to a kilo total would be arithmetic on two different
 *  units. */
function weekBuckets(n) {
  const t = today(), start = weekStart(addDays(t, -7 * (n - 1))), keys = [];
  for (let i = 0; i < n; i++) keys.push(addDays(start, 7 * i));
  const b = {};
  keys.forEach((k) => { b[k] = { week: k, vol: 0, days: {} }; });
  state.log.forEach((l) => {
    if (l.type !== "set") return;
    const ex = BY_ID[l.exId], w = weekStart(l.date);
    if (!ex || !b[w]) return;
    b[w].days[l.date] = 1;
    if (ex.unit === "kg") {
      b[w].vol += l.load * (ex.db && state.settings.dbPer !== "total" ? 2 : 1) * sum(l.reps);
    } else if (ex.unit === "pin") {
      const k = pinToKg(ex, l.load);
      if (k != null) b[w].vol += k * sum(l.reps);
    }
  });
  return keys.map((k) => ({ week: k, vol: b[k].vol, days: Object.keys(b[k].days).length }));
}

/** The index, standard and ratio at the end of every week, so the charts
 *  can show the trend. Weekly rather than per-session keeps the line
 *  readable and the arithmetic cheap. */
function history() {
  const ds = trainDates();
  if (!ds.length) return [];
  const t = today(), out = [];
  let w = weekStart(ds[0]);
  const lastW = weekStart(t);
  while (w <= lastW) {
    const asOf = addDays(w, 6) > t ? t : addDays(w, 6);
    const gi = groupIndex(asOf), oi = overallIndex(gi);
    if (oi.idx != null) {
      const bw = bwOn(asOf), ss = stdScores(asOf), s2w = strengthToWeight(ss, bw);
      const os = overallStd(ss);
      out.push({ date: asOf, idx: oi.idx, cov: oi.cov, bw: bw, ratio: s2w.ratio, std: os.score, gi: gi });
    }
    w = addDays(w, 7);
  }
  return out;
}

/* ---- programme health, reusing the existing status logic ------ */
function healthCounts() {
  const c = { ok: 0, s1: 0, stall: 0, plateau: 0, decline: 0, new: 0 };
  PROGRAMME.forEach((e) => { c[statusFor(e.id, state.log).code]++; });
  const withLoad = PROGRAMME.filter((e) => state.loads[e.id] != null && state.peaks[e.id] != null);
  const atPeak = withLoad.filter((e) => state.loads[e.id] >= state.peaks[e.id]).length;
  const below = withLoad.filter((e) => state.loads[e.id] < state.peaks[e.id]);
  return Object.assign(c, { atPeak: atPeak, below: below.length, total: withLoad.length, unset: PROGRAMME.length - withLoad.length });
}

function rirTrend() {
  const sets = state.log.filter((l) => l.type === "set" && l.rir != null).sort((a, b) => a.ts - b.ts);
  if (sets.length < 4) return null;
  const recent = sets.slice(-20), older = sets.slice(-60, -20);
  const mean = (a) => a.reduce((x, l) => x + l.rir, 0) / a.length;
  return { recent: mean(recent), older: older.length >= 4 ? mean(older) : null, n: sets.length };
}

/* ---- whoop ---------------------------------------------------- */
const WHOOP_FIELDS = [
  { k: "recovery", label: "Recovery", unit: "%", max: 100 },
  { k: "hrv", label: "HRV", unit: "ms", max: 300 },
  { k: "rhr", label: "Resting HR", unit: "bpm", max: 120 },
  { k: "sleep", label: "Sleep", unit: "h", max: 14 },
  { k: "strain", label: "Strain", unit: "", max: 21 },
];

const whoopSorted = () => state.whoop.slice().sort((a, b) => a.date.localeCompare(b.date));

function whoopStats(days) {
  const cut = addDays(today(), -days);
  const rows = whoopSorted().filter((r) => r.date >= cut);
  const out = { n: rows.length };
  WHOOP_FIELDS.forEach((f) => {
    const vals = rows.map((r) => r[f.k]).filter((v) => v != null && v !== "");
    out[f.k] = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  });
  const trained = new Set(trainDates());
  const rec = rows.filter((r) => r.recovery != null);
  const on = rec.filter((r) => trained.has(r.date)).map((r) => r.recovery);
  const off = rec.filter((r) => !trained.has(r.date)).map((r) => r.recovery);
  const mean = (a) => (a.length ? a.reduce((x, y) => x + y, 0) / a.length : null);
  out.recOnTraining = mean(on);
  out.recOnRest = mean(off);
  out.onN = on.length; out.offN = off.length;
  return out;
}

/* ================================================================
   CHARTS -- hand-drawn SVG, no library. Every label names a value the
   chart actually reaches, and the viewBox leaves room for the outermost
   text so nothing clips on a narrow phone.
================================================================= */

/** A minimal trend line for inside a tile: no axes, no labels, spaced by
 *  point order rather than true dates, since a tile has room to say
 *  "trending up", not to be read precisely. */
function sparkline(pts, color) {
  if (!pts || pts.length < 2) return "";
  const w = 62, h = 22, pad = 2;
  const ys = pts.map((p) => p.y);
  let y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  if (y1 === y0) { y0 -= 1; y1 += 1; }
  const X = (i) => pad + (i / (pts.length - 1)) * (w - pad * 2);
  const Y = (v) => pad + (1 - (v - y0) / (y1 - y0)) * (h - pad * 2);
  const d = pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
  const last = pts[pts.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + w + " " + h + '" preserveAspectRatio="none" role="img" aria-hidden="true">' +
    '<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>' +
    '<circle cx="' + X(pts.length - 1).toFixed(1) + '" cy="' + Y(last.y).toFixed(1) + '" r="2" fill="' + color + '"/>' +
    "</svg>";
}

/**
 * Wraps a chart in its panel, or explains why there is no chart yet. Every
 * trend needs at least two points, and hiding the panel entirely when there
 * is one made a young log look like a broken app.
 */
function trendPanel(label, pts, waiting, draw, note) {
  if (pts.length >= 2) {
    return '<div class="panel"><div class="panel-label">' + esc(label) + "</div>" + draw() +
      (note ? '<div class="hint">' + note + "</div>" : "") + "</div>";
  }
  return '<div class="panel"><div class="panel-label">' + esc(label) + "</div>" +
    '<div class="body-copy">' + esc(pts.length === 1 ? "One point so far. " + waiting : waiting) + "</div></div>";
}

/**
 * series: [{ pts:[{x:'YYYY-MM-DD', y:Number}], c:cssColour, w:strokeWidth, area:bool, dots:bool }]
 * o:      { h, yMin, yMax, fmt, ref, refLabel }
 */
function lineChart(series, o) {
  o = o || {};
  const W = 340, H = o.h || 128, pl = 34, pr = 10, pt = 10, pb = 20;
  const all = series.reduce((a, s) => a.concat(s.pts), []);
  if (all.length === 0) return '<div class="body-copy">Nothing to plot yet.</div>';
  const fmt = o.fmt || ((v) => String(Math.round(v)));

  const xs = all.map((p) => parseD(p.x).getTime());
  let x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  if (x1 === x0) { x0 -= 3 * DAY; x1 += 3 * DAY; }

  const ys = all.map((p) => p.y).concat(o.ref != null ? [o.ref] : []);
  let y0 = o.yMin != null ? o.yMin : Math.min.apply(null, ys);
  let y1 = o.yMax != null ? o.yMax : Math.max.apply(null, ys);
  if (y1 === y0) { y0 -= 1; y1 += 1; }
  const padY = (y1 - y0) * 0.14;
  if (o.yMin == null) y0 -= padY;
  if (o.yMax == null) y1 += padY;

  const X = (v) => pl + ((parseD(v).getTime() - x0) / (x1 - x0)) * (W - pl - pr);
  const Y = (v) => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);

  let g = "";
  [y0, (y0 + y1) / 2, y1].forEach((v) => {
    g += '<line class="grid" x1="' + pl + '" y1="' + Y(v).toFixed(1) + '" x2="' + (W - pr) + '" y2="' + Y(v).toFixed(1) + '"/>' +
      '<text x="' + (pl - 6) + '" y="' + (Y(v) + 3.2).toFixed(1) + '" text-anchor="end">' + esc(fmt(v)) + "</text>";
  });

  if (o.ref != null) {
    g += '<line x1="' + pl + '" y1="' + Y(o.ref).toFixed(1) + '" x2="' + (W - pr) + '" y2="' + Y(o.ref).toFixed(1) +
      '" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>';
    if (o.refLabel) g += '<text x="' + (pl + 4) + '" y="' + (Y(o.ref) - 5).toFixed(1) + '">' + esc(o.refLabel) + "</text>";
  }

  series.forEach((s) => {
    if (!s.pts.length) return;
    const pts = s.pts.slice().sort((a, b) => a.x.localeCompare(b.x));
    const d = pts.map((p, i) => (i ? "L" : "M") + X(p.x).toFixed(1) + " " + Y(p.y).toFixed(1)).join(" ");
    if (s.area && pts.length > 1) {
      g += '<path d="' + d + " L" + X(pts[pts.length - 1].x).toFixed(1) + " " + Y(y0).toFixed(1) +
        " L" + X(pts[0].x).toFixed(1) + " " + Y(y0).toFixed(1) + ' Z" fill="' + s.c + '" fill-opacity="0.1" stroke="none"/>';
    }
    g += '<path d="' + d + '" fill="none" stroke="' + s.c + '" stroke-width="' + (s.w || 2) +
      '" stroke-linejoin="round" stroke-linecap="round"/>';
    if (s.dots !== false) {
      const last = pts[pts.length - 1];
      g += '<circle cx="' + X(last.x).toFixed(1) + '" cy="' + Y(last.y).toFixed(1) + '" r="3.2" fill="' + s.c + '"/>';
    }
    if (pts.length === 1) g += '<circle cx="' + X(pts[0].x).toFixed(1) + '" cy="' + Y(pts[0].y).toFixed(1) + '" r="3.2" fill="' + s.c + '"/>';

    /* Tap-to-read, primary series only. The circle drawn for the line is
       too small to hit reliably with a thumb, so an invisible one sits on
       top of it, wide enough to tap without the reader ever seeing it. */
    if (o.pickKey && s === series[0]) {
      pts.forEach((p) => {
        g += '<circle cx="' + X(p.x).toFixed(1) + '" cy="' + Y(p.y).toFixed(1) + '" r="13" fill="transparent" style="cursor:pointer" ' +
          'data-key="' + esc(o.pickKey) + '" data-x="' + esc(p.x) + '" data-y="' + p.y + '" onclick="pickTrend(this)"></circle>';
      });
    }
  });

  const sortedAll = all.slice().sort((a, b) => a.x.localeCompare(b.x));
  g += '<text x="' + pl + '" y="' + (H - 5) + '">' + esc(fmtDay(sortedAll[0].x)) + "</text>" +
    '<text x="' + (W - pr) + '" y="' + (H - 5) + '" text-anchor="end">' + esc(fmtDay(sortedAll[sortedAll.length - 1].x)) + "</text>";

  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img">' + g + "</svg>";
}

/** Pentagon radar over the five groups. One axis per group, in the same
 *  order everywhere on the page so the shape is comparable at a glance. */
function radarChart(vals, o) {
  o = o || {};
  const W = 300, H = 250, cx = 150, cy = 118, R = 82;
  const max = o.max || 100, min = o.min || 0;
  const pt = (i, r) => {
    const a = (-90 + i * 72) * Math.PI / 180;
    return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
  };
  let g = "";

  [0.25, 0.5, 0.75, 1].forEach((f) => {
    const poly = MG_ORDER.map((_, i) => pt(i, R * f).map((n) => n.toFixed(1)).join(",")).join(" ");
    g += '<polygon points="' + poly + '" fill="none" stroke="var(--line)" stroke-width="1"/>';
  });
  MG_ORDER.forEach((_, i) => {
    const p = pt(i, R);
    g += '<line x1="' + cx + '" y1="' + cy + '" x2="' + p[0].toFixed(1) + '" y2="' + p[1].toFixed(1) + '" stroke="var(--line)" stroke-width="1"/>';
  });

  const have = MG_ORDER.every((mg) => vals[mg] != null);
  if (have) {
    const poly = MG_ORDER.map((mg, i) => {
      const f = clamp((vals[mg] - min) / (max - min), 0, 1);
      return pt(i, R * f).map((n) => n.toFixed(1)).join(",");
    }).join(" ");
    g += '<polygon points="' + poly + '" fill="var(--accent)" fill-opacity="0.16" stroke="var(--accent)" stroke-width="2"/>';
  }
  MG_ORDER.forEach((mg, i) => {
    if (vals[mg] == null) return;
    const f = clamp((vals[mg] - min) / (max - min), 0, 1);
    const p = pt(i, R * f);
    g += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="4" fill="' + MG[mg].c + '"/>';
  });

  MG_ORDER.forEach((mg, i) => {
    const p = pt(i, R + 22);
    const anchor = i === 0 ? "middle" : p[0] > cx + 2 ? "start" : p[0] < cx - 2 ? "end" : "middle";
    const dx = anchor === "start" ? -6 : anchor === "end" ? 6 : 0;
    g += '<text x="' + (p[0] + dx).toFixed(1) + '" y="' + (p[1] + 3).toFixed(1) + '" text-anchor="' + anchor +
      '" fill="' + MG[mg].c + '" font-size="10.5">' + esc(MG[mg].label) + "</text>" +
      '<text x="' + (p[0] + dx).toFixed(1) + '" y="' + (p[1] + 15).toFixed(1) + '" text-anchor="' + anchor + '" font-size="9.5">' +
      (vals[mg] == null ? "--" : esc(String(Math.round(vals[mg])))) + "</text>";
  });

  if (!have) g += '<text x="' + cx + '" y="' + (cy + 3) + '" text-anchor="middle" font-size="9.5">' +
    esc(MG_ORDER.filter((mg) => vals[mg] == null).length + " group(s) unlogged") + "</text>";

  return '<svg class="chart" viewBox="0 0 ' + W + " " + H + '" role="img">' + g + "</svg>";
}

/** Sessions per week as a stack of blocks, one block per session. Reads as
 *  a count rather than a length, which is what a session is. */
function weeksStrip(buckets) {
  const maxRows = Math.max(4, Math.max.apply(null, buckets.map((b) => b.days)));
  let h = '<div class="weeks">';
  buckets.forEach((b) => {
    h += '<div class="wk" title="' + esc(fmtDay(b.week)) + ", " + b.days + ' session(s)">';
    for (let i = 0; i < maxRows; i++) h += "<i" + (i < b.days ? "" : ' class="empty"') + "></i>";
    h += "</div>";
  });
  h += "</div>";
  h += '<div class="wk-axis"><span>' + esc(fmtDay(buckets[0].week)) + "</span><span>" +
    esc(fmtDay(buckets[buckets.length - 1].week)) + "</span></div>";
  return h;
}

function mgRow(label, colour, value, o) {
  o = o || {};
  const lo = o.lo == null ? 0 : o.lo, hi = o.hi == null ? 100 : o.hi;
  const pct = value == null ? 0 : clamp(((value - lo) / (hi - lo)) * 100, 0, 100);
  const ticks = (o.ticks || []).map((t) => '<u style="left:' + clamp(((t - lo) / (hi - lo)) * 100, 0, 100).toFixed(1) + '%"></u>').join("");
  return '<div class="mg-row">' +
    '<span class="mg-dot" style="background:' + colour + '"></span>' +
    '<span class="mg-name">' + esc(label) + "</span>" +
    '<span class="mg-bar">' + ticks + '<i style="width:' + pct.toFixed(1) + "%;background:" + colour + '"></i></span>' +
    '<span class="mg-val' + (value == null ? " none" : "") + '">' + (value == null ? esc(o.none || "no data") : esc(o.fmt ? o.fmt(value) : String(Math.round(value)))) + "</span>" +
    "</div>";
}

/* ================================================================
   PAGES: progress, bodyweight, recovery
================================================================= */

/** The history point closest to n days ago, for period-on-period deltas. */
function pickBack(h, days) {
  if (h.length < 2) return null;
  const want = addDays(today(), -days);
  if (h[0].date > want) return null;
  let best = h[0];
  h.forEach((p) => { if (p.date <= want) best = p; });
  return best === h[h.length - 1] ? null : best;
}

function deltaSpan(now, then, o) {
  o = o || {};
  if (then == null || now == null) return "";
  const d = now - then;
  const cls = o.neutral || Math.abs(d) < (o.eps || 0.05) ? "" : d > 0 ? (o.invert ? "dn" : "up") : (o.invert ? "up" : "dn");
  const s = (d > 0 ? "+" : d < 0 ? "−" : "") + (o.fmt ? o.fmt(Math.abs(d)) : String(Math.round(Math.abs(d))));
  return '<span class="' + cls + '">' + esc(s) + "</span>";
}

/** When a session was last logged, or null. */
function sessionLastDone(sid) {
  const dates = state.log
    .filter((l) => l.type === "set" && BY_ID[l.exId] && BY_ID[l.exId].s === sid)
    .map((l) => l.date).sort();
  return dates.length ? dates[dates.length - 1] : null;
}

/**
 * What to offer next. Deliberately NOT the session the programme pins to
 * today's weekday: miss a Thursday and a weekday rule would skip Lower B
 * entirely, and reorder a week and it argues with you. Position in the
 * rotation survives both. Anything already started today stays offered,
 * so a session logged across two visits does not hand you the next one.
 */
function nextSession() {
  const sets = state.log.filter((l) => l.type === "set" && BY_ID[l.exId]);
  if (!sets.length) return { s: SESSIONS[0], why: "first one in the programme" };
  const last = sets.sort((a, b) => b.ts - a.ts)[0];
  const lastSid = BY_ID[last.exId].s;
  if (last.date === today()) {
    return { s: SESSIONS.filter((x) => x.id === lastSid)[0], why: "in progress today" };
  }
  const i = SESSIONS.findIndex((x) => x.id === lastSid);
  const s = SESSIONS[(i + 1) % SESSIONS.length];
  const done = sessionLastDone(s.id);
  const gap = done ? daysBetween(done, today()) : null;
  return { s: s, why: gap == null ? "not logged yet" : gap === 1 ? "last done yesterday" : "last done " + gap + " days ago" };
}

/** A bar that grows either side of zero. Change has a sign, and a bar
 *  running left for a loss says that far better than a number near 100. */
function dvRow(label, colour, pct, o) {
  o = o || {};
  const range = o.range || 60;
  let fill = "";
  if (pct != null) {
    const p = clamp(pct, -range, range);
    const w = ((Math.abs(p) / range) * 50).toFixed(1);
    fill = p >= 0
      ? '<i style="left:50%;width:' + w + "%;background:" + colour + '"></i>'
      : '<i style="right:50%;width:' + w + "%;background:" + colour + '"></i>';
  }
  const txt = pct == null ? (o.none || "no data")
    : (pct > 0 ? "+" : pct < 0 ? "−" : "") + Math.abs(Math.round(pct)) + "%";
  return '<div class="mg-row">' +
    '<span class="mg-dot" style="background:' + colour + '"></span>' +
    '<span class="mg-name">' + esc(label) + "</span>" +
    '<span class="dv-bar"><u class="zero"></u>' + fill + "</span>" +
    '<span class="mg-val' + (pct == null ? " none" : "") + '">' + esc(txt) + "</span>" +
    "</div>";
}

/**
 * The landing page.
 *
 * Two numbers, and which one leads matters. STRENGTH is the bodyweight-multiple
 * standard: it answers "how strong am I", it is comparable between groups, and
 * it is the one that should agree with what you already know about yourself.
 * PROGRESS is each lift against its own starting load: it answers "am I moving",
 * says nothing about whether you were strong to begin with, and is shown as a
 * signed percentage from zero rather than as a score around 100.
 *
 * Leading with progress was the earlier mistake. A strong body part that has
 * not improved lately reads flat, which looks like weakness and is not.
 */
/** One muscle group's strength score, with the lift it came from named. The
 *  group takes its best lift, so naming that lift is what makes the score
 *  arguable rather than a black box. */
function stdRow(mg, r) {
  const ticks = [25, 50, 75].map((v) => '<u style="left:' + v + '%"></u>').join("");
  const w = r.score == null ? 0 : clamp(r.score, 0, 100);
  const lo = r.scoreLow == null ? 0 : clamp(r.scoreLow, 0, 100);

  /* Solid to where the group's lifts still agree, pale from there to the
     headline figure. The pale stretch is the part only your best lift is
     claiming, so a long one means the score is the optimistic end of a
     range rather than a reading. */
  const hasBand = r.score != null && r.scoreLow != null && w - lo > 1;
  const band = hasBand
    ? '<b style="left:' + lo.toFixed(1) + "%;width:" + (w - lo).toFixed(1) + "%;background:" + MG[mg].c + '"></b>'
    : "";
  const solid = hasBand ? lo : w;

  const tag = r.confidence === "single"
    ? '<span class="conf" style="color:var(--warn);border-color:var(--warn-edge)">1 lift</span>'
    : r.confidence === "wide"
      ? '<span class="conf" style="color:var(--warn);border-color:var(--warn-edge)">lifts disagree</span>'
      : r.confidence === "ok"
        ? '<span class="conf" style="color:var(--muted);border-color:var(--line)">' + r.lifts.length + " lifts</span>"
        : "";

  let sub;
  if (r.score == null) {
    sub = r.eligible ? "no scoreable lift logged in eight weeks" : "nothing in this group can be scored";
  } else if (r.lifts.length < 2) {
    sub = "via " + esc(r.from) + " · " + n1(r.mult) + "\u00d7 bodyweight · nothing cross-checks it";
  } else {
    sub = "via " + esc(r.from) + " · " + n1(r.mult) + "\u00d7 bodyweight · your other lifts here say " +
      Math.round(r.scoreLow) + " to " + Math.round(r.score);
  }

  return '<div class="std-row">' +
    '<div class="row baseline" style="gap:9px;margin-bottom:8px">' +
    '<span class="mg-dot" style="background:' + MG[mg].c + '"></span>' +
    '<span class="std-name">' + esc(MG[mg].label) + " " + tag + "<em>" + sub + "</em></span>" +
    '<span class="mg-val' + (r.score == null ? " none" : "") + '">' +
    (r.score == null ? "none" : esc(String(Math.round(r.score)))) + "</span>" +
    "</div>" +
    '<span class="mg-bar full">' + band + ticks +
    '<i style="width:' + solid.toFixed(1) + "%;background:" + MG[mg].c + '"></i></span>' +
    "</div>";
}


/* ================================================================
   TRENDS PAGE

   Five small stacked charts on the dashboard were each too cramped to
   read and, together, a lot of scrolling for not much insight. One big
   chart with a metric switcher and a range picker replaces them: the
   reader picks what to look at, sees it drawn properly, and can tap a
   point to read its exact date and value.
================================================================= */

const TREND_RANGES = [
  { key: "3m", label: "3M", days: 90 },
  { key: "6m", label: "6M", days: 183 },
  { key: "1y", label: "1Y", days: 366 },
  { key: "all", label: "All", days: Infinity },
];

/* Which metric and range are on screen, and the last point tapped in
   each metric. Module-level rather than on `view` so switching pages
   and coming back to Trends leaves it where it was. */
let trendMetric = "progress";
let trendRange = "6m";
let trendPick = {};

function setTrendMetric(k) { trendMetric = k; render(); }
window.setTrendMetric = setTrendMetric;
function setTrendRange(k) { trendRange = k; render(); }
window.setTrendRange = setTrendRange;

/** A tapped chart point, read off its data- attributes and filed under
 *  the metric that was on screen when it was tapped. */
function pickTrend(el) {
  const k = el.getAttribute("data-key");
  trendPick[k] = { x: el.getAttribute("data-x"), y: parseFloat(el.getAttribute("data-y")) };
  render();
}
window.pickTrend = pickTrend;

/** The single-series metrics. Each is worked out fresh on every render,
 *  which is cheap here and keeps this page never out of date. */
function trendMetrics() {
  const hist = history();
  const uncal = PROGRAMME.filter((e) => e.unit === "pin" && pinToKg(e, 1) == null).length;
  return {
    progress: {
      label: "Progress", c: "var(--pb)", area: true,
      pts: hist.map((p) => ({ x: p.date, y: p.idx - 100 })),
      fmt: (v) => (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(Math.round(v)) + "%",
      ref: 0, refLabel: "start",
      explain: "Every lift against the load it started on, averaged per group. Each point uses the eight weeks up to that week, so a deload shows up honestly rather than being smoothed away. No standards tables or conversions in this one, so it is the number to trust.",
      waiting: "Log a second week of sets and this fills in.",
    },
    strength: {
      label: "Strength", c: "var(--accent)", area: true, yMin: 0,
      pts: hist.filter((p) => p.std != null).map((p) => ({ x: p.date, y: p.std })),
      fmt: (v) => Math.round(v) + "/100",
      ref: 50, refLabel: "intermediate",
      explain: "Best lift in each group, read against bodyweight standards: 25 novice, 50 intermediate, 75 advanced, 100 elite. Cables and isolation work are excluded, and a group needs a scoreable lift inside the last eight weeks or it drops out of the average.",
      waiting: "Needs a bodyweight entry plus a barbell or dumbbell lift logged in two different weeks.",
    },
    bodyweight: {
      label: "Bodyweight", c: "var(--mg-legs)", area: true,
      pts: bwSorted().map((r) => ({ x: r.date, y: r.kg })),
      fmt: (v) => n1(v) + "kg",
      explain: "First thing, after the loo, before food, is the comparison that holds.",
      waiting: "Weigh in twice and the line appears.",
    },
    ratio: {
      label: "Str : BW", c: "var(--mg-shoulders)", area: false,
      pts: hist.filter((p) => p.ratio != null).map((p) => ({ x: p.date, y: p.ratio })),
      fmt: (v) => n1(v) + "×",
      explain: "The five anchor lifts added up, over bodyweight. The one number a bulk cannot flatter: it rises only if the lifts move faster than the scale.",
      waiting: "Needs bodyweight plus scoreable lifts in two different weeks.",
    },
    tonnage: {
      label: "Tonnage", c: "var(--mg-chest)", area: true,
      pts: weekBuckets(104).filter((b) => b.vol > 0).map((b) => ({ x: b.week, y: b.vol / 1000 })),
      fmt: (v) => n1(v) + "t",
      explain: "Load × reps, per week. Kilo lifts always, plus any cable machine whose stack you have measured" +
        (uncal > 0 ? "; " + uncal + " machine(s) are still unmeasured, so their work is missing from this line" : "") +
        ". Answers how much work, not how heavy.",
      waiting: "Needs sets logged in two different weeks.",
    },
    sleep: {
      label: "Sleep", c: "var(--mg-shoulders)", area: true, yMax: 12,
      pts: whoopSorted().filter((r) => r.sleep != null).map((r) => ({ x: r.date, y: r.sleep })),
      fmt: (v) => n1(v) + "h",
      ref: 8, refLabel: "8h",
      explain: "Hand-entered on the Recovery page for now. The moment a Whoop feed or an Apple Health Shortcut lands, it fills this same field, so the chart needs no change, only a source that stops requiring you to type it.",
      waiting: "Log a second night on the Recovery page and this fills in.",
    },
  };
}

function renderTrends() {
  const metrics = trendMetrics();
  const rangeDef = TREND_RANGES.filter((r) => r.key === trendRange)[0] || TREND_RANGES[1];

  let out = '<div style="margin-bottom:18px"><h1 class="title">Trends</h1>' +
    '<div class="lede">How the numbers move, not just where they stand.</div></div>';

  out += '<div class="chiprow">' + Object.keys(metrics).map((k) =>
    '<button class="chip' + (trendMetric === k ? " active" : "") + '" onclick="setTrendMetric(\'' + k + '\')">' + esc(metrics[k].label) + "</button>"
  ).join("") +
    '<button class="chip' + (trendMetric === "groups" ? " active" : "") + '" onclick="setTrendMetric(\'groups\')">By group</button></div>';

  out += '<div class="chiprow">' + TREND_RANGES.map((r) =>
    '<button class="chip sm' + (trendRange === r.key ? " active" : "") + '" onclick="setTrendRange(\'' + r.key + '\')">' + esc(r.label) + "</button>"
  ).join("") + "</div>";

  if (trendMetric === "groups") {
    const hist = history();
    const gseries = MG_ORDER.map((mg) => ({
      pts: hist.filter((p) => p.gi[mg].idx != null && daysBetween(p.date, today()) <= rangeDef.days)
        .map((p) => ({ x: p.date, y: p.gi[mg].idx - 100 })),
      c: MG[mg].c, w: 1.8, dots: false,
    })).filter((s) => s.pts.length >= 2);
    out += '<div class="panel">';
    if (gseries.length) {
      out += lineChart(gseries, { ref: 0, refLabel: "start", h: 220, fmt: (v) => (v > 0 ? "+" : "") + Math.round(v) + "%" }) +
        '<div class="legend">' + MG_ORDER.map((mg) => '<span><i style="background:' + MG[mg].c + '"></i>' + esc(MG[mg].label) + "</span>").join("") + "</div>";
    } else {
      out += '<div class="body-copy">Needs at least two muscle groups with two logged weeks each in this range.</div>';
    }
    out += '<div class="hint" style="margin-top:12px">Every group’s progress line side by side, so you can see whether one is dragging behind the others rather than reading five separate charts to find out.</div></div>';
  } else {
    const m = metrics[trendMetric];
    const pts = m.pts.filter((p) => daysBetween(p.x, today()) <= rangeDef.days);
    out += '<div class="panel">';
    if (pts.length >= 2) {
      out += lineChart([{ pts: pts, c: m.c, area: m.area }],
        { ref: m.ref, refLabel: m.refLabel, h: 220, yMin: m.yMin, fmt: m.fmt, pickKey: trendMetric });
      const remembered = trendPick[trendMetric];
      const pick = remembered && pts.some((p) => p.x === remembered.x) ? remembered : pts[pts.length - 1];
      out += '<div class="readout"><span>' + esc(fmtDay(pick.x)) + "</span><b>" + esc(m.fmt(pick.y)) + "</b></div>";
    } else {
      out += '<div class="body-copy">' + esc(
        pts.length === 1 && m.pts.length >= 2
          ? "Only one point falls inside " + rangeDef.label + ". Widen the range, or " + m.waiting.charAt(0).toLowerCase() + m.waiting.slice(1)
          : m.waiting
      ) + "</div>";
    }
    out += '<div class="hint" style="margin-top:12px">' + esc(m.explain) + "</div></div>";
  }

  /* Consistency lives here rather than on Home: it is a shape over time
     like everything else on this page, not a current-state number. */
  const g = gymStats();
  const wb = weekBuckets(16);
  out += '<div class="panel"><div class="panel-label">Sessions, last 16 weeks</div>' + weeksStrip(wb) +
    '<div class="divider"><div class="kv">' +
    '<div><div class="k">This week</div><div class="v">' + g.week + "</div></div>" +
    '<div><div class="k">This month</div><div class="v">' + g.month + "</div></div>" +
    '<div><div class="k">Week streak</div><div class="v">' + g.streak + "</div></div>" +
    '<div><div class="k">Per week</div><div class="v">' + n1(g.perWeek) + "</div></div>" +
    "</div></div></div>";

  shell(out);
}

function renderDash() {
  const t = today();
  const gi = groupIndex(t), oi = overallIndex(gi);
  const ss = stdScores(t), os = overallStd(ss);
  const bw = bwLatest(), bwKg = bw ? bw.kg : 0;
  const s2w = strengthToWeight(ss, bwKg);
  const g = gymStats();
  const hist = history();
  const prev = pickBack(hist, 28);
  const next = nextSession();
  const cutoff = Date.now() - 28 * 864e5;

  let out = '<div style="margin-bottom:20px">' +
    '<h1 class="title">Gym log</h1>' +
    '<div class="lede">Upper/Lower. Double progression, ' + PROGRAMME[0].lo + "\u2013" + PROGRAMME[0].hi +
    " reps, then load.</div></div>";

  if (err) out += '<div class="note err">' + esc(err) + "</div>";

  if (PROGRAMME.every((e) => state.loads[e.id] == null)) {
    out += '<div class="note" style="border-color:var(--accent-edge);background:var(--accent-tint)">' +
      '<strong style="color:var(--accent)">No working loads on this device.</strong> They are no longer written into the app, ' +
      "so they live in your browser and travel in a backup file rather than in the code. Restore a backup to bring them across, " +
      "or just start logging: the weight you type on your first set becomes that lift\u2019s load." +
      '<div class="stack" style="margin-top:12px">' +
      '<button class="btn-mini" onclick="go({page:\'settings\'})">Restore a backup</button>' +
      "</div></div>";
  }

  out += syncBanner();

  out += '<div class="stack" style="margin-bottom:8px">' +
    '<button class="btn-primary" onclick="go({page:\'session\',sid:\'' + next.s.id + '\'})">Log ' + esc(next.s.name) +
    '<span style="font-weight:500;opacity:0.7"> · ' + esc(next.why) + "</span></button>" +
    "</div>" +
    '<div class="stack" style="margin-bottom:20px">' +
    '<button class="btn-secondary" onclick="go({page:\'sessions\'})">Another session</button>' +
    '<button class="btn-secondary auto" onclick="go({page:\'log\'})">Full log</button>' +
    "</div>";

  SESSIONS.map((s) => {
    const bad = PROGRAMME.filter((e) => e.s === s.id).filter((e) => {
      const st = statusFor(e.id, state.log);
      const lastSet = state.log.slice().reverse().find((l) => l.exId === e.id && l.type === "set");
      return (st.code === "plateau" || st.code === "decline") && lastSet && lastSet.ts > cutoff;
    });
    return { s: s, n: bad.length };
  }).filter((c) => c.n >= 3).forEach((c) => {
    out += '<div class="note"><strong style="color:var(--bad)">Cluster in ' + esc(c.s.name) + ".</strong> " +
      c.n + " lifts plateaued or declining inside four weeks. That is usually recovery, sleep or the deficit rather than the exercises. Worth raising.</div>";
  });

  if (g.total === 0) {
    out += '<div class="panel"><div class="body-copy">Nothing logged yet, so there is nothing to measure. Save a few sets and this page fills itself in: strength against bodyweight standards, progress against your starting loads, weight, and days at the gym.</div></div>';
    out += bwCard();
    out += '<div class="stack" style="margin-top:14px">' +
      '<button class="btn-secondary auto" onclick="go({page:\'whoop\'})">Recovery</button>' +
      "</div>";
    shell(out);
    return;
  }

  if (!bw) {
    out += '<div class="note" style="border-color:var(--warn-edge);background:var(--warn-tint)">' +
      '<strong style="color:var(--warn)">No bodyweight logged.</strong> Strength and strength-to-weight are both bodyweight-relative, so they stay blank until you weigh in. ' +
      '<button class="btn-mini" style="margin-top:10px" onclick="go({page:\'body\'})">Add bodyweight</button></div>';
  }

  const ordStd = MG_ORDER.filter((mg) => ss[mg].score != null).sort((a, b) => ss[a].score - ss[b].score);
  const soft = MG_ORDER.filter((mg) => ss[mg].confidence === "single" || ss[mg].confidence === "wide").length;
  const pct = oi.idx == null ? null : oi.idx - 100;
  const pctPrev = prev && prev.idx != null ? prev.idx - 100 : null;

  out += '<div class="tiles">';

  const sparkProgress = sparkline(hist.map((p) => ({ x: p.date, y: p.idx - 100 })), "var(--pb)");
  const sparkRatio = sparkline(hist.filter((p) => p.ratio != null).map((p) => ({ x: p.date, y: p.ratio })), "var(--mg-shoulders)");
  const sparkBw = sparkline(bwSorted().map((r) => ({ x: r.date, y: r.kg })), "var(--mg-legs)");
  const sparkDays = sparkline(weekBuckets(12).map((b) => ({ x: b.week, y: b.days })), "var(--accent)");

  out += '<div class="tile lead wide' + (sparkProgress ? " has-spark" : "") + '">' +
    (sparkProgress ? '<div class="tile-spark">' + sparkProgress + "</div>" : "") +
    '<div class="tile-label">Progress since start</div>' +
    '<div class="tile-val" style="color:var(--accent)">' +
    (pct == null ? "--" : (pct > 0 ? "+" : pct < 0 ? "−" : "") + Math.abs(Math.round(pct)) + '<span class="unit">%</span>') +
    "</div>" +
    '<div class="tile-foot">' + (pct == null ? "No lifts logged yet."
      : "Every lift against the load it started on, averaged across " + oi.cov + " of 5 groups" +
        (pctPrev != null ? ". " + deltaSpan(pct, pctPrev, { fmt: (v) => n1(v) }) + " points in four weeks" : "") +
        ". No standards tables or conversions in this one, so it is the number to trust.") +
    "</div></div>";

  out += '<div class="tile' + (sparkRatio ? " has-spark" : "") + '">' +
    (sparkRatio ? '<div class="tile-spark">' + sparkRatio + "</div>" : "") +
    '<div class="tile-label">Str : BW</div>' +
    '<div class="tile-val">' + (s2w.ratio == null ? "--" : esc(String(n1(s2w.ratio)))) + '<span class="unit">× BW</span></div>' +
    '<div class="tile-foot">' + (s2w.ratio == null ? "Needs bodyweight."
      : Math.round(s2w.total) + "kg across five lifts" + (s2w.complete ? "" : ", " + esc(s2w.missing.join(" and ")) + " missing") +
        (prev && prev.ratio ? ". " + deltaSpan(s2w.ratio, prev.ratio, { fmt: (v) => n1(v), eps: 0.02 }) + " in four weeks" : "")) +
    "</div></div>";

  out += '<div class="tile' + (sparkBw ? " has-spark" : "") + '">' +
    (sparkBw ? '<div class="tile-spark">' + sparkBw + "</div>" : "") +
    '<div class="tile-label">Weight</div>' +
    '<div class="tile-val">' + (bw ? esc(String(n1(bw.kg))) : "--") + '<span class="unit">kg</span></div>' +
    '<div class="tile-foot">' + (bw
      ? (bwDelta(28) != null
          ? deltaSpan(bwKg, bwKg - bwDelta(28), { fmt: (v) => n1(v), eps: 0.15, neutral: true }) + "kg in four weeks"
          : "First weigh-in " + esc(fmtDay(bw.date)))
      : "Not logged") + "</div></div>";

  out += '<div class="tile' + (sparkDays ? " has-spark" : "") + '">' +
    (sparkDays ? '<div class="tile-spark">' + sparkDays + "</div>" : "") +
    '<div class="tile-label">Gym days</div>' +
    '<div class="tile-val">' + g.last28 + '<span class="unit"> / 28 days</span></div>' +
    '<div class="tile-foot">' + n1(g.perWeek) + " a week · " + g.total + " all time" +
    (g.gap === 0 ? " · trained today" : g.gap === 1 ? " · last one yesterday" : " · " + g.gap + " days since the last") +
    "</div></div>";

  out += "</div>";

  /* ---- strength by group: the panel that should match your own read ---- */
  out += '<div class="panel">' + panelHead("Strength by muscle group", "strength");
  out += '<div class="body-copy" style="margin-bottom:14px">' +
    (os.score == null
      ? "Needs a bodyweight entry and one barbell or dumbbell lift logged."
      : "Overall " + Math.round(os.score) + " of 100, " + esc(os.level.toLowerCase()) + ", across " + os.cov + " of 5 groups" +
        (prev && prev.std != null ? ", " + deltaSpan(os.score, prev.std) + " in four weeks" : "") + ". " +
        (soft > 0 ? "Treat that loosely: " + soft + " of " + os.cov + " groups rest on one lift or on lifts that disagree." : "")) +
    "</div>";
  MG_ORDER.forEach((mg) => { out += stdRow(mg, ss[mg]); });
  out += infoBody("strength",
    "<p>Your best lift in each group, converted to what it implies for that group\u2019s benchmark movement, then read against bodyweight: 25 novice, 50 intermediate, 75 advanced, 100 elite, on " +
    esc(state.settings.sex === "female" ? "female" : "male") + " standards. Cables and isolation work are excluded: an unknown 2:1 pulley can halve the real load, and a group takes its best lift, so one loose conversion would swing the whole score.</p>" +
    "<p><strong style=\"color:var(--text)\">Where this is weak.</strong> Comparing one group against another is the softest part. The published standards behind each benchmark are drawn from different crowds, " +
    "squat and deadlift figures from powerlifters, curl figures from bodybuilding trainees, so advanced on one table is not quite advanced on another. " +
    "Arms is anchored on a barbell curl, an isolation lift, while the other four are anchored on compounds, which makes it the least comparable of the five.</p>" +
    "<p>Each conversion is a single estimate with no error bar, which is what the pale stretch on the bars shows: solid to where your own lifts still agree, pale to the figure only your best lift is claiming. " +
    "Read a group against itself over time, and read the ordering between groups. Do not read three points between two groups as real.</p>") +
    "</div>";

  const radarVals = {};
  MG_ORDER.forEach((mg) => { radarVals[mg] = ss[mg].score; });
  out += '<div class="panel"><div class="panel-label">Balance</div>' +
    radarChart(radarVals, { min: 0, max: 100 }) +
    '<div class="hint">Rings are 25, 50, 75 and 100. A lopsided pentagon is the useful read.</div></div>';

  /* ---- progress: change, with a sign, from zero ---- */
  out += '<div class="panel">' + panelHead("Progress by muscle group", "progress");
  MG_ORDER.forEach((mg) => {
    out += dvRow(MG[mg].label, MG[mg].c, gi[mg].idx == null ? null : gi[mg].idx - 100);
  });
  out += infoBody("progress",
    "<p>Each lift against the load the programme started it on, averaged per group so six leg exercises cannot outvote six arm exercises. Bars run left for a loss and right for a gain, and the scale runs to plus or minus 60 per cent.</p>" +
    "<p>Cable pins and bodyweight movements count here with no calibration at all, because a ratio between two pin positions carries no units. That is why this number survives objections the strength score cannot: there are no population tables in it and no conversions between exercises.</p>" +
    "<p>It says nothing about whether a group is strong, only whether it is moving.</p>") +
    "</div>";

  /* ---- programme health ---- */
  const hc = healthCounts();
  const rt = rirTrend();
  out += '<div class="panel"><div class="panel-label">Programme health</div>' +
    '<div class="kv">' +
    '<div><div class="k">Progressing</div><div class="v" style="color:var(--pb)">' + hc.ok + "</div></div>" +
    '<div><div class="k">Stalling</div><div class="v" style="color:var(--warn)">' + (hc.s1 + hc.stall) + "</div></div>" +
    '<div><div class="k">Plateau</div><div class="v" style="color:var(--bad)">' + hc.plateau + "</div></div>" +
    '<div><div class="k">Declining</div><div class="v" style="color:var(--bad)">' + hc.decline + "</div></div>" +
    '<div><div class="k">Unlogged</div><div class="v" style="color:var(--muted)">' + hc.new + "</div></div>" +
    "</div>" +
    '<div class="divider body-copy">' + hc.atPeak + " of " + hc.total + " lifts are at their peak load. " + hc.below +
    " sit below peak, so the first job on those is re-attainment rather than a new record." +
    (rt && rt.older != null
      ? " Average reps in reserve is " + n1(rt.recent) + " over the last 20 sets against " + n1(rt.older) + " before that" +
        (rt.recent > rt.older + 0.4 ? ", so you are leaving more in the tank than you were."
          : rt.recent < rt.older - 0.4 ? ", so you are pushing closer to failure than you were." : ".")
      : "") +
    "</div>" +
    '<div class="stack" style="margin-top:14px"><button class="btn-mini" onclick="go({page:\'pb\'})">PB register</button></div></div>';

  /* ---- support work ---- */
  if (SUPPORT_ORDER.some((s) => gi[s].idx != null)) {
    out += '<div class="panel"><div class="panel-label">Support work · progress only</div>';
    SUPPORT_ORDER.forEach((s) => {
      out += dvRow(SUPPORT[s].label, "var(--support)", gi[s].idx == null ? null : gi[s].idx - 100);
    });
    out += '<div class="hint">Core, grip, neck and cuff work runs on a different scale from a leg press, and has no bodyweight standard worth quoting, so it is tracked for movement only and stays out of overall strength.</div></div>';
  }

  /* ---- last trained ---- */
  out += '<div class="panel"><div class="panel-label">Last trained</div>';
  MG_ORDER.concat(SUPPORT_ORDER).forEach((k) => {
    const row = gi[k], lbl = MG[k] ? MG[k].label : SUPPORT[k].label;
    const c = MG[k] ? MG[k].c : "var(--support)";
    const days = row.last ? daysBetween(row.last, t) : null;
    const tone = days == null ? C.muted : days <= 7 ? C.pb : days <= 14 ? C.warn : C.bad;
    out += '<div class="list-row"><span><span class="mg-dot" style="background:' + c + ';display:inline-block;margin-right:8px"></span>' + esc(lbl) + "</span>" +
      '<span style="color:' + tone + '">' + (days == null ? "never" : days === 0 ? "today" : days === 1 ? "yesterday" : days + " days ago") +
      '<span style="color:var(--muted)"> · ' + row.n + "/" + row.total + " lifts logged</span></span></div>";
  });
  out += "</div>";

  out += bwCard();

  out += '<div class="stack" style="margin-top:14px">' +
    '<button class="btn-secondary auto" onclick="go({page:\'whoop\'})">Recovery</button>' +
    "</div>";

  shell(out);
}

/* ---------------- bodyweight ---------------- */
function renderBody() {
  const rows = bwSorted().slice().reverse();
  const last = bwLatest();
  let out = backBar("go({page:'home'})", "Bodyweight", "One entry a day, the latest wins");

  out += '<div class="panel">' +
    '<div class="panel-label">Weigh in for ' + esc(fmtDay(today())) + "</div>" +
    '<div class="bw-quick">' +
    '<input class="load-input" id="bwInput" type="number" step="0.1" inputmode="decimal" placeholder="' +
    (last ? esc(String(n1(last.kg))) : "kg") + '" onkeydown="if(event.key===\'Enter\')saveBw()">' +
    '<button class="btn-primary auto" onclick="saveBw()">Save</button>' +
    "</div>" +
    '<div class="hint">Kilos. First thing, after the loo, before food, is the comparison that holds. ' +
    (last ? "Last entry " + esc(String(n1(last.kg))) + "kg on " + esc(fmtDay(last.date)) + "." : "No entries yet.") + "</div></div>";

  if (rows.length >= 2) {
    const deltas = [{ n: 7, d: bwDelta(7) }, { n: 28, d: bwDelta(28) }, { n: 90, d: bwDelta(90) }];
    out += '<div class="panel"><div class="panel-label">Change</div><div class="kv">';
    deltas.forEach((row) => {
      const d = row.d;
      const colour = d == null ? "var(--muted)" : Math.abs(d) < 0.2 ? "var(--text)" : d > 0 ? "var(--warn)" : "var(--pb)";
      const txt = d == null ? "--" : (d > 0 ? "+" : d < 0 ? "\u2212" : "") + n1(Math.abs(d));
      out += '<div><div class="k">' + row.n + ' days</div>' +
        '<div class="v" style="color:' + colour + '">' + esc(String(txt)) + "</div></div>";
    });
    out += "</div>" +
      '<div class="hint">Amber for up, green for down, which assumes you would rather be lighter. ' +
      "If you are deliberately gaining, read them the other way round. The strength-to-weight ratio on the Progress page is what settles whether a gain is paying for itself.</div></div>";
  } else {
    out += '<div class="panel"><div class="panel-label">Change and history</div>' +
      '<div class="body-copy">' +
      (rows.length === 1
        ? "One weigh-in so far, on " + esc(fmtDay(rows[0].date)) + ". Two or more and the 7, 28 and 90 day changes appear here with a chart underneath."
        : "Nothing weighed yet. Save one above, then another on a different day, and the changes and the chart appear here.") +
      "</div></div>";
  }

  /* The sparse case is already covered by the panel above, which mentions the
     chart, so this one only appears once there is a line worth drawing. */
  if (rows.length >= 2) {
    out += trendPanel("History", bwSorted().map((r) => ({ x: r.date, y: r.kg })), "",
      () => lineChart([{ pts: bwSorted().map((r) => ({ x: r.date, y: r.kg })), c: "var(--mg-legs)", area: true }],
        { h: 130, fmt: (v) => n1(v) + "kg" }));
  }

  out += '<div class="stack" style="margin:4px 0 4px">' +
    '<button class="btn-secondary auto" onclick="go({page:\'whoop\'})">Recovery</button>' +
    "</div>";

  if (rows.length) {
    out += '<div class="panel"><div class="panel-label">' + rows.length + " entr" + (rows.length === 1 ? "y" : "ies") + "</div>";
    rows.slice(0, 40).forEach((r) => {
      out += '<div class="list-row"><span>' + esc(fmtDay(r.date)) + '<span style="color:var(--muted)"> · ' + esc(r.date.slice(0, 4)) + "</span></span>" +
        '<span>' + esc(String(n1(r.kg))) + "kg" +
        '<button class="btn-back" style="margin:0 0 0 10px;font-size:13px" onclick="delBw(\'' + esc(r.date) + '\')">Remove</button></span></div>';
    });
    if (rows.length > 40) out += '<div class="hint">Showing the most recent 40.</div>';
    out += "</div>";
  }

  shell(out);
}

function saveBw() {
  const el = document.getElementById("bwInput");
  const v = parseFloat(el.value);
  if (isNaN(v) || v <= 0 || v > 400) { flash("Enter a weight in kilos"); return; }
  const d = today();
  const rest = state.bw.filter((r) => r.date !== d);
  persist({ bw: rest.concat([{ date: d, kg: Number(v.toFixed(1)), ts: Date.now() }]) });
  flash("Bodyweight saved");
  render();
}
window.saveBw = saveBw;

function delBw(date) {
  persist({ bw: state.bw.filter((r) => r.date !== date) });
  render();
}
window.delBw = delBw;

/* ---------------- recovery / whoop ---------------- */
function renderWhoop() {
  const rows = whoopSorted().slice().reverse();
  const s7 = whoopStats(7), s28 = whoopStats(28);
  let out = backBar("go({page:'body'})", "Recovery", "Whoop-shaped, hand-fed for now");

  out += '<div class="placeholder" style="margin-bottom:14px">' +
    "<strong>Space held for Whoop.</strong> Whoop does publish a developer API, but it authenticates with an OAuth client " +
    "secret, and this page is static on GitHub Pages, which has nowhere safe to keep one. Pulling automatically needs a small " +
    "server sitting in between, so until then it is hand-fed. The five fields below are exactly what Whoop reports, in Whoop's " +
    "own units, so a live feed or a CSV export drops into this shape with no migration.</div>";

  out += '<div class="panel"><div class="panel-label">Log for ' + esc(fmtDay(today())) + "</div>" +
    '<div class="wgrid">';
  WHOOP_FIELDS.forEach((f) => {
    const existing = state.whoop.filter((r) => r.date === today())[0];
    const v = existing && existing[f.k] != null ? existing[f.k] : "";
    out += '<div><label for="w_' + f.k + '">' + esc(f.label) + (f.unit ? " (" + esc(f.unit) + ")" : "") + "</label>" +
      '<input class="field" id="w_' + f.k + '" type="number" step="0.1" inputmode="decimal" value="' + esc(String(v)) + '"></div>';
  });
  out += "</div>" +
    '<div class="stack" style="margin-top:14px"><button class="btn-primary auto" onclick="saveWhoop()">Save today</button></div>' +
    '<div class="hint">Leave anything you do not have blank. Strain is Whoop’s 0-21 scale.</div></div>';

  if (s28.n) {
    out += '<div class="panel"><div class="panel-label">Averages</div>' +
      '<div class="kv">' + WHOOP_FIELDS.map((f) => {
        const v = s7[f.k] != null ? s7[f.k] : s28[f.k];
        return '<div><div class="k">' + esc(f.label) + "</div><div class=\"v\">" + (v == null ? "--" : esc(String(n1(v)))) +
          '<span style="font-size:12px;color:var(--muted)">' + esc(f.unit) + "</span></div></div>";
      }).join("") + "</div>" +
      '<div class="hint">Last 7 days where there is data, otherwise the last 28. ' + s28.n + " day(s) logged in the last 28.</div></div>";

    if (s28.recOnTraining != null && s28.recOnRest != null) {
      const d = s28.recOnTraining - s28.recOnRest;
      out += '<div class="panel"><div class="panel-label">Recovery against training</div>' +
        '<div class="kv">' +
        '<div><div class="k">Gym days</div><div class="v">' + Math.round(s28.recOnTraining) + '<span style="font-size:12px;color:var(--muted)">%</span></div></div>' +
        '<div><div class="k">Rest days</div><div class="v">' + Math.round(s28.recOnRest) + '<span style="font-size:12px;color:var(--muted)">%</span></div></div>' +
        "</div>" +
        '<div class="hint">' + s28.onN + " gym days against " + s28.offN + " rest days, last 28. " +
        (Math.abs(d) < 4 ? "No real difference yet."
          : d > 0 ? "You train on your better days, which is sensible and also means the programme is not what is draining you."
            : "You are training on your worse days. Worth a look if lifts are stalling in clusters.") +
        " Correlation needs a few weeks of both before it says much.</div></div>";
    }

    const recPts = whoopSorted().filter((r) => r.recovery != null).map((r) => ({ x: r.date, y: r.recovery }));
    if (recPts.length >= 2) {
      out += '<div class="panel"><div class="panel-label">Recovery</div>' +
        lineChart([{ pts: recPts, c: "var(--pb)", area: true }], { h: 118, yMin: 0, yMax: 100, fmt: (v) => Math.round(v) + "%" }) + "</div>";
    }
    const sleepPts = whoopSorted().filter((r) => r.sleep != null).map((r) => ({ x: r.date, y: r.sleep }));
    if (sleepPts.length >= 2) {
      out += '<div class="panel"><div class="panel-label">Sleep</div>' +
        lineChart([{ pts: sleepPts, c: "var(--mg-shoulders)", area: true }], { h: 110, ref: 8, refLabel: "8h", fmt: (v) => n1(v) + "h" }) + "</div>";
    }
  }

  if (rows.length) {
    out += '<div class="panel"><div class="panel-label">' + rows.length + " day(s) logged</div>";
    rows.slice(0, 30).forEach((r) => {
      const bits = WHOOP_FIELDS.filter((f) => r[f.k] != null).map((f) => n1(r[f.k]) + f.unit);
      out += '<div class="list-row"><span>' + esc(fmtDay(r.date)) + "</span>" +
        '<span style="color:var(--muted);text-align:right">' + esc(bits.join(" · ") || "empty") +
        '<button class="btn-back" style="margin:0 0 0 10px;font-size:13px" onclick="delWhoop(\'' + esc(r.date) + '\')">Remove</button></span></div>';
    });
    out += "</div>";
  }

  shell(out);
}

function saveWhoop() {
  const rec = { date: today(), ts: Date.now() };
  let any = false;
  WHOOP_FIELDS.forEach((f) => {
    const el = document.getElementById("w_" + f.k);
    const v = parseFloat(el.value);
    if (!isNaN(v)) { rec[f.k] = Number(v.toFixed(1)); any = true; }
  });
  if (!any) { flash("Nothing to save"); return; }
  persist({ whoop: state.whoop.filter((r) => r.date !== rec.date).concat([rec]) });
  flash("Recovery saved");
  render();
}
window.saveWhoop = saveWhoop;

function delWhoop(date) {
  persist({ whoop: state.whoop.filter((r) => r.date !== date) });
  render();
}
window.delWhoop = delWhoop;

/** Bodyweight quick entry, on the home screen because it is a daily habit
 *  that has nothing to do with being at the rack. */
function bwCard() {
  const last = bwLatest();
  const d = bwDelta(28);
  const age = last ? daysBetween(last.date, today()) : null;
  const when = last == null ? "not logged yet"
    : (age === 0 ? "logged today" : age === 1 ? "logged yesterday" : "logged " + age + " days ago") +
      (d != null ? " \u00b7 " + (d > 0 ? "+" : d < 0 ? "\u2212" : "") + n1(Math.abs(d)) + "kg in four weeks" : "");
  return '<div class="panel mt-lg">' +
    '<div class="row baseline" style="margin-bottom:12px">' +
    "<div>" +
    '<div class="panel-label" style="margin-bottom:6px">Bodyweight</div>' +
    '<div class="bw-now">' + (last ? esc(String(n1(last.kg))) : "\u2013\u2013") + '<span class="unit">kg</span></div>' +
    '<div class="meta">' + esc(when) + "</div>" +
    "</div>" +
    '<button class="btn-mini" onclick="go({page:\'body\'})">History</button>' +
    "</div>" +
    '<div class="bw-quick">' +
    '<input class="load-input" id="bwInput" type="number" step="0.1" inputmode="decimal" placeholder="' +
    (last ? esc(String(n1(last.kg))) : "kg") + '" onkeydown="if(event.key===\'Enter\')saveBw()">' +
    '<button class="btn-primary auto" onclick="saveBw()">Save</button>' +
    "</div>" +
    '<div class="hint">Needed for the strength standard and the strength-to-weight ratio, both of which are bodyweight-relative.</div>' +
    "</div>";
}


/* ================================================================
   CABLE STACK CALIBRATION

   A pin position is a place on a stack, not a weight, so cable lifts have
   no kilos to compare against a barbell. Measure the stack once per machine
   and they join the strength standard and the tonnage total.

   The model is linear: kg = kg-at-pin-1 + (pin - 1) x step. Cable stacks
   are plate-per-pin, so this holds, and it copes with the half-pin notation
   the log already uses (13.5 renders as "13+"). Progress percentages never
   needed any of this, because a ratio between two pin positions is unitless.
================================================================= */

/** Kilos at a pin position, or null when that machine is not calibrated. */
function pinToKg(ex, pin) {
  const c = (state.settings.pins || {})[ex.id];
  if (!c || c.p1 == null || !(c.step > 0)) return null;
  /* The "+" in the log is an add-on plate resting on the pin, NOT a half
     step down the stack: "13+" is pin 13 plus the plate. Modelling it as
     pin 12.5 understated every one of those entries. */
  const whole = Math.floor(Number(pin));
  const stack = c.p1 + (whole - 1) * c.step + (Number(pin) > whole ? addOnKg() : 0);
  /* A 2:1 pulley halves what reaches your hands, add-on plate included,
     since it rides on the stack side. Tonnage should count the load you
     moved, not the number painted on the machine. */
  return c.half ? stack / 2 : stack;
}

/** Weight of the small plate that the "+" notation adds to the pin. Rotimi
 *  measured it as roughly 1.125kg and will confirm; it is a setting rather
 *  than a constant so a corrected figure needs no code change. */
function addOnKg() {
  const v = Number(state.settings.addOnKg);
  return isFinite(v) && v >= 0 ? v : 1.125;
}

const PIN_EXS = () => PROGRAMME.filter((e) => e.unit === "pin");

function renderPins() {
  const exs = PIN_EXS();
  const cal = state.settings.pins || {};
  const done = exs.filter((e) => pinToKg(e, 1) != null).length;

  let h = backBar("go({page:'settings'})", "Cable stacks", done + " of " + exs.length + " calibrated");

  h += '<div class="panel"><div class="panel-label">What to note at the gym</div><div class="body-copy">' +
    "Two numbers per machine: the weight printed beside pin 1, and beside pin 10. The step per pin comes out of the pair, and half pins work as they do in the log. " +
    "Then check the box if the machine has a 2:1 pulley, which you can tell because the handle travels about twice as far as the stack does. " +
    "That one halves the load actually reaching your hands, so it matters more than the markings do. " +
    "If every stack in the gym is the same, fill the two boxes below and apply them in one go." +
    "</div><div class=\"hint\">This feeds weekly tonnage only. Cable lifts are kept out of the strength score on purpose: " +
    "with an unknown pulley ratio a stack reading can be out by a factor of two, and most of this work is isolation, which is a weak proxy for a one-rep max even when the load is exact. " +
    "Progress percentages have never needed any of it, because a ratio between two pin positions carries no units. Nothing here edits a logged set.</div></div>";

  h += '<div class="panel"><div class="panel-label">The "+" plate</div>' +
    '<div class="stack" style="margin-bottom:10px">' +
    '<input class="field half" type="number" step="any" inputmode="decimal" value="' + esc(String(addOnKg())) +
    '" oninput="setSetting(\'addOnKg\', parseFloat(this.value))">' +
    "</div>" +
    '<div class="body-copy">A load written as 13+ means pin 13 with the small add-on plate on top. Correct the weight here once you have put it on a scale. It applies to every machine.</div></div>';

  h += '<div class="panel"><div class="panel-label">Same stack on every machine</div>' +
    '<div class="stack" style="margin-bottom:12px">' +
    '<input class="field half" id="qfP1" type="number" step="any" inputmode="decimal" placeholder="kg at pin 1">' +
    '<input class="field half" id="qfP10" type="number" step="any" inputmode="decimal" placeholder="kg at pin 10">' +
    "</div>" +
    '<div class="stack">' +
    '<button class="btn-secondary auto" onclick="fillPins(false)">Fill the empty ones</button>' +
    '<button class="btn-secondary warn auto" onclick="fillPins(true)">Overwrite all</button>' +
    "</div></div>";

  SESSIONS.forEach((s) => {
    const mine = exs.filter((e) => e.s === s.id);
    if (!mine.length) return;
    h += '<div class="panel"><div class="panel-label">' + esc(s.name) + "</div>";
    mine.forEach((e) => {
      const c = cal[e.id] || {};
      h += '<div style="padding:11px 0;border-bottom:1px solid var(--line)">' +
        '<div class="row baseline" style="margin-bottom:9px;gap:10px">' +
        '<div class="name sm" style="flex:1">' + esc(e.name) + "</div>" +
        '<div id="pinout_' + e.id + '" style="font-size:13px;white-space:nowrap;color:' +
        (pinToKg(e, 1) == null ? "var(--muted)" : "var(--accent)") + '">' + esc(pinReadout(e)) + "</div>" +
        "</div>" +
        '<div class="stack">' +
        '<input class="field half" type="number" step="any" inputmode="decimal" placeholder="kg at pin 1" value="' +
        (c.p1 != null ? esc(String(c.p1)) : "") + '" oninput="setPin(\'' + e.id + '\',\'p1\',this.value)">' +
        '<input class="field half" type="number" step="any" inputmode="decimal" placeholder="kg at pin 10" value="' +
        (c.p10 != null ? esc(String(c.p10)) : "") + '" oninput="setPin(\'' + e.id + '\',\'p10\',this.value)">' +
        "</div>" +
        '<label class="check" style="margin-top:10px;font-size:13px">' +
        '<input type="checkbox" ' + (c.half ? "checked" : "") + ' onchange="setPin(\'' + e.id + '\',\'half\',this.checked)">' +
        '<span>2:1 pulley<span style="color:var(--muted)"> · handle travels twice as far as the stack</span></span></label>' +
        "</div>";
    });
    h += "</div>";
  });

  shell(h);
}

function pinReadout(ex) {
  const load = state.loads[ex.id];
  if (load == null) return "no load set";
  const kg = pinToKg(ex, load);
  return "pin " + fmtPin(load) + (kg == null ? ", no kg" : " = " + n1(kg) + "kg");
}

/** Persists without re-rendering, so typing does not steal focus from the
 *  field. The one readout that changes is patched in place. */
function setPin(exId, key, v) {
  const pins = Object.assign({}, state.settings.pins || {});
  const c = Object.assign({}, pins[exId] || {});
  if (key === "half") {
    c.half = !!v;
  } else {
    const n = parseFloat(v);
    if (isNaN(n)) delete c[key]; else c[key] = n;
  }
  if (c.p1 != null && c.p10 != null && c.p10 > c.p1) c.step = (c.p10 - c.p1) / 9;
  else delete c.step;
  pins[exId] = c;
  setSetting("pins", pins);
  const el = document.getElementById("pinout_" + exId);
  if (el) {
    el.textContent = pinReadout(BY_ID[exId]);
    el.style.color = pinToKg(BY_ID[exId], 1) == null ? "var(--muted)" : "var(--accent)";
  }
}
window.setPin = setPin;

function fillPins(overwrite) {
  const p1 = parseFloat(document.getElementById("qfP1").value);
  const p10 = parseFloat(document.getElementById("qfP10").value);
  if (isNaN(p1) || isNaN(p10) || p10 <= p1) { flash("Enter pin 1 and pin 10, with pin 10 heavier"); return; }
  const pins = Object.assign({}, state.settings.pins || {});
  let n = 0;
  PIN_EXS().forEach((e) => {
    if (!overwrite && pinToKg(e, 1) != null) return;
    pins[e.id] = { p1: p1, p10: p10, step: (p10 - p1) / 9 };
    n++;
  });
  setSetting("pins", pins);
  flash(n + " machine(s) calibrated");
  render();
}
window.fillPins = fillPins;


/* ---- boot ---- */
load();
render();
</script>
